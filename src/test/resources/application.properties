app.jobs.subscription-expiration.enabled=false
app.jobs.subscription-purchase-expiration.enabled=false
app.jobs.subscription-payment-events.enabled=false
app.jobs.subscription-purchase-activation.enabled=false
debug=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework=WARN
# Each cached test context owns a Hikari pool; cap both so the full suite stays under PostgreSQL max_connections.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
