spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# Behind the reverse proxy (Caddy), trust X-Forwarded-For/Proto from private-network
# proxies so getRemoteAddr() returns the real client IP (QR rate limits, audit logs).
server:
  forward-headers-strategy: native

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  public-menu:
    base-url: ${PUBLIC_MENU_BASE_URL}
    require-https: true
  jwt:
    secret: ${JWT_SECRET}
