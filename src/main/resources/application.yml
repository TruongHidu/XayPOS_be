spring:
  application:
    name: pos-saas-be
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

app:
  bootstrap:
    super-admin:
      enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
      name: ${SUPER_ADMIN_NAME:System Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
