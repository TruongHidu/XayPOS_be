    post:
      operationId: cancelSubscriptionPurchase
      summary: '[IMPLEMENTED] Hủy purchase chưa thanh toán'
      description: 'expectedVersion bắt buộc; reason optional. PENDING_PAYMENT còn hạn chưa matched payment mới cancel được.
        CANCELLED trả200 no-op trước check version, không audit lần hai. PAID/ACTIVATED/REVIEW_REQUIRED/CLOSED409 PURCHASE_CANNOT_CANCEL.
        EXPIRED409 PURCHASE_PERIOD_EXPIRED. Cancel và settlement cùng restaurant lock; nếu cancel thắng tiền đến sau vẫn lưu
        review. Không cần Idempotency-Key. allowedActions chỉ có CREATE_PAYMENT_ATTEMPT khi purchase PENDING_PAYMENT, owner có quyền CREATE, accept-new bật và SePay đã cấu hình.
        Quyền từ JWT phải có và vẫn còn hiệu lực trong DB; đổi quyền cần refresh/login lại.'
      tags:
      - Subscription purchase
      x-implementation-status: IMPLEMENTED
      x-target-phase: 2
      x-required-permissions:
      - SUBSCRIPTION_PURCHASE_CANCEL
      x-required-role: OWNER
      security:
      - bearerAuth: []
      x-tenant-policy: Principal tenant only; cross-tenant UUID=404.
      x-cache-policy: 'Cache-Control: no-store; Vary: Authorization.'
      x-idempotency-policy: Theo description; guard trước replay và business mutation.
      parameters:
      - name: purchaseId
        in: path
        required: true
        description: Purchase thuộc tenant từ principal, khác tenant trả404.
        schema:
          type: string
          format: uuid
