  /webhooks/subscriptions/sepay:
    post:
      operationId: receiveSepaySubscriptionWebhook
      summary: '[IMPLEMENTED] Nhận giao dịch SePay với HMAC riêng'
      description: Xác thực HMAC-SHA256 trên timestamp.rawBody, constant-time compare, ±300giây theo Clock. JSON tối đa64KiB.
        Không JWT và không phải public không xác thực. Parse sau verify. ACK200 success=true chỉ sau inbox commit hoặc xác
        nhận durable duplicate. Duplicate đang PROCESSING vẫn ACK nhưng worker tiếp tục. Trả503 nếu chưa lưu được; tuyệt đối
        không202 cho provider. Financial match/activation chạy durable worker, không chờ trong request. Nội dung và bank account
        được kiểm tra lại khi settlement; chữ ký hợp lệ không đồng nghĩa đã PAID. HMAC header mẫu không phải chữ ký dùng được.
      tags:
      - SePay subscription webhook
      x-implementation-status: IMPLEMENTED
      x-target-phase: 4
      x-required-permissions: []
      x-required-role: PROVIDER_HMAC
      security:
      - sepayHmac: []
      x-tenant-policy: Derive from trusted platform account config + immutable attempt reference, never JWT/restaurantId client.
      x-cache-policy: 'Cache-Control: no-store.'
      x-idempotency-policy: DB unique provider/account/transaction; no client Idempotency-Key. Canonical bank identity + independent
        webhook/API aliases.
      parameters:
      - name: X-SePay-Timestamp
        in: header
        required: true
        description: Unix seconds lúc ký, không phải bank transactionDate; lệch tối đa300giây.
        schema:
          type: string
          pattern: ^[0-9]{10,12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SepayWebhookPayload'
            examples:
              incomingDemo:
                value:
                  id: 92704
                  gateway: Vietcombank
                  transactionDate: '2026-11-01 10:05:00'
                  accountNumber: '0000000000'
                  subAccount: ''
                  code: PS0123456789ABCDEF0123
                  content: PS0123456789ABCDEF0123
                  transferType: in
                  description: DEMO subscription transfer
                  transferAmount: 399000
                  accumulated: 399000
                  referenceCode: DEMOFT0001
      responses:
        '200':
          description: Chỉ xác nhận đã nhận bền vững; không khẳng định subscription activated.
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SepayAck'
              examples:
                durablyReceivedOrDuplicate:
                  value:
                    success: true
        '400':
          description: 'VALIDATION_ERROR: Thiếu/sai header, query, path UUID, body field hoặc range. INVALID_REQUEST_BODY:
            JSON lỗi, sai kiểu hoặc unknown business field.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: Thiếu/sai header, query, path UUID, body field hoặc range.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                INVALID_REQUEST_BODY:
                  value:
                    success: false
                    code: INVALID_REQUEST_BODY
                    message: JSON lỗi, sai kiểu hoặc unknown business field.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '401':
