components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token hiện có; OWNER đúng tenant hoặc system SUPER_ADMIN tùy endpoint.
    sepayHmac:
      type: apiKey
      in: header
      name: X-SePay-Signature
      description: sha256=<64hex> = HMAC-SHA256(secret, timestamp + . + rawBody). X-SePay-Timestamp bắt buộc, Clock ±300s.
        Không bearerAuth. Xác minh đúng thuật toán trước parse, apiKey ở đây chỉ mô tả nơi chứa chữ ký.
  schemas:
    PurchaseStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - PAID
      - ACTIVATED
      - EXPIRED
      - CANCELLED
      - REVIEW_REQUIRED
      - CLOSED
    AttemptStatus:
      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILED
      - EXPIRED
      - CANCELLED
    EventStatus:
      type: string
      enum:
      - RECEIVED
      - PROCESSING
      - RETRY_PENDING
      - PROCESSED
      - REVIEW_REQUIRED
      - CLOSED
    SubscriptionState:
      type: string
      enum:
      - NONE
      - PENDING
      - ACTIVE
      - EXPIRED
      - CANCELLED
    Action:
      type: string
      enum:
      - CREATE_PURCHASE
      - VIEW_PURCHASE
      - CREATE_PAYMENT_ATTEMPT
      - CANCEL_PURCHASE
      - WAIT_PAYMENT
      - WAIT_ACTIVATION
      - CONTACT_SUPPORT
      - OPEN_APP
    BlockedReason:
      type: string
      enum:
      - PURCHASE_UNAVAILABLE
      - PURCHASE_PERMISSION_REQUIRED
      - SUBSCRIPTION_ALREADY_ACTIVE
      - SUBSCRIPTION_PENDING_EXISTS
      - PURCHASE_REVIEW_REQUIRED
      - PURCHASE_IN_PROGRESS
    ReviewReason:
      type: string
      enum:
      - AMOUNT_MISMATCH
      - REFERENCE_UNMATCHED
      - REFERENCE_AMBIGUOUS
      - ACCOUNT_MISMATCH
      - OUTGOING_TRANSFER
      - DUPLICATE_PAYMENT
      - PURCHASE_CANCELLED
      - PAYMENT_OUTSIDE_WINDOW
      - SUBSCRIPTION_CONFLICT
      - RESTAURANT_UNAVAILABLE
      - IDENTITY_UNCERTAIN
      - IDENTITY_CONFLICT
      - TECHNICAL_RETRY_EXHAUSTED
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 1000
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          description: Map field→message; {} khi không có lỗi field, theo handler/filter hiện có.
        timestamp:
          type: string
          format: date-time
          pattern: Z$
      required:
      - success
      - code
      - message
      - fieldErrors
      - timestamp
    FeatureGrant:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 100
          minLength: 1
        limits:
          type: object
          additionalProperties: true
          description: Giới hạn feature từ catalog, không có maxStaff tại đây.
      required:
      - code
      - limits
    PurchaseQuote:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        packageId:
          type: string
          format: uuid
        packageCode:
          type: string
          maxLength: 50
          minLength: 1
        packageName:
          type: string
          maxLength: 100
          minLength: 1
        priceAmount:
          type: integer
          minimum: 1
          maximum: 999999999999
          description: VND nguyên đồng; BigDecimal/NUMERIC(14,2) ở server; không float, không nhận giá từ FE.
        currencyCode:
          type: string
          const: VND
        billingCycleMonths:
          type: integer
          minimum: 1
          maximum: 32767
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureGrant'
          uniqueItems: true
        maxStaff:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 9223372036854775807
          description: Top-level package limit; null=unlimited.
        quotedAt:
          type: string
          format: date-time
          pattern: Z$
        expiresAt:
          type: string
          format: date-time
          pattern: Z$
        billingZoneId:
          type: string
          const: Asia/Ho_Chi_Minh
      required:
      - schemaVersion
      - packageId
      - packageCode
      - packageName
      - priceAmount
      - currencyCode
      - billingCycleMonths
      - features
      - maxStaff
      - quotedAt
      - expiresAt
      - billingZoneId
    SubscriptionSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - EXPIRED
          - CANCELLED
        effective:
          type: boolean
        packageCode:
          type: string
          maxLength: 50
        startAt:
          type: string
          format: date-time
          pattern: Z$
        endAt:
          type: string
          format: date-time
          pattern: Z$
        activatedAt:
          oneOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
      required:
      - id
      - status
      - effective
      - packageCode
      - startAt
      - endAt
      - activatedAt
    PurchaseView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PurchaseStatus'
        displayStatus:
          $ref: '#/components/schemas/PurchaseStatus'
        quote:
          $ref: '#/components/schemas/PurchaseQuote'
        subscriptionId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        paidAt:
          oneOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        activatedAt:
          oneOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        cancelledAt:
          oneOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        closedAt:
          oneOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        reviewReason:
          oneOf:
          - $ref: '#/components/schemas/ReviewReason'
          - type: 'null'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Action'
        createdAt:
          type: string
          format: date-time
          pattern: Z$
        updatedAt:
          type: string
          format: date-time
          pattern: Z$
        version:
          type: integer
          format: int64
          minimum: 0
        serverTime:
          type: string
          format: date-time
          pattern: Z$
      required:
      - id
      - status
      - displayStatus
      - quote
      - subscriptionId
      - paidAt
      - activatedAt
      - cancelledAt
      - closedAt
      - reviewReason
      - allowedActions
      - createdAt
      - updatedAt
      - version
      - serverTime
      description: status đã lưu; displayStatus project expiry cho PENDING_PAYMENT, không ghi DB. Replay trả body insert cũ;
        gọi GET để lấy hiện tại.
      allOf:
      - if:
          properties:
            status:
              const: ACTIVATED
          required:
          - status
        then:
          properties:
            subscriptionId:
              type: string
              format: uuid
            paidAt:
              type: string
              format: date-time
              pattern: Z$
            activatedAt:
              type: string
              format: date-time
              pattern: Z$
      - if:
          properties:
            status:
              const: PAID
          required:
          - status
        then:
          properties:
            paidAt:
              type: string
              format: date-time
              pattern: Z$
            subscriptionId:
              type: 'null'
            activatedAt:
              type: 'null'
      - if:
          properties:
            status:
              enum:
              - PENDING_PAYMENT
              - EXPIRED
              - CANCELLED
          required:
          - status
        then:
          properties:
            paidAt:
              type: 'null'
            subscriptionId:
              type: 'null'
            activatedAt:
              type: 'null'
      - if:
          properties:
            status:
              const: CANCELLED
          required:
          - status
        then:
          properties:
            cancelledAt:
              type: string
              format: date-time
              pattern: Z$
      - if:
          properties:
            status:
              const: CLOSED
          required:
          - status
        then:
          properties:
            closedAt:
              type: string
              format: date-time
              pattern: Z$
      - if:
          properties:
            status:
              const: REVIEW_REQUIRED
          required:
          - status
        then:
          properties:
            reviewReason:
              $ref: '#/components/schemas/ReviewReason'
      - if:
          properties:
            status:
              const: PENDING_PAYMENT
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - PENDING_PAYMENT
              - EXPIRED
      - if:
          properties:
            status:
              const: PAID
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - PAID
      - if:
          properties:
            status:
              const: ACTIVATED
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - ACTIVATED
      - if:
          properties:
            status:
              const: EXPIRED
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - EXPIRED
      - if:
          properties:
            status:
              const: CANCELLED
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - CANCELLED
      - if:
          properties:
            status:
              const: REVIEW_REQUIRED
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - REVIEW_REQUIRED
      - if:
          properties:
            status:
              const: CLOSED
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - CLOSED
    PaymentInstructions:
      type: object
      additionalProperties: false
      properties:
        bankCode:
          type: string
          maxLength: 30
          minLength: 1
        accountNumber:
          type: string
          maxLength: 100
          minLength: 1
        accountName:
          type: string
          maxLength: 150
          minLength: 1
        transferContent:
          type: string
          pattern: ^PS[0-9A-F]{20}$
        qrPayload:
          type: string
          maxLength: 4096
          minLength: 1
          description: VietQR payload do adapter tạo, FE render QR offline. Giá trị trong ví dụ là DEMO, không dùng chuyển
            tiền.
        qrImageUrl:
          description: Link ảnh QR của SePay (qr.sepay.vn/img) dựng offline từ cùng tài khoản/số tiền/nội dung; FE có thể
            hiển thị bằng thẻ img thay cho tự render qrPayload. null nếu adapter không hỗ trợ.
          oneOf:
          - type: string
            format: uri
            maxLength: 2048
          - type: 'null'
      required:
      - bankCode
      - accountNumber
      - accountName
      - transferContent
      - qrPayload
    PaymentAttemptView:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        purchaseId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttemptStatus'
        displayStatus:
          $ref: '#/components/schemas/AttemptStatus'
        provider:
          type: string
          const: SEPAY
        referenceCode:
          type: string
          pattern: ^PS[0-9A-F]{20}$
        amount:
          type: integer
          minimum: 1
          maximum: 999999999999
          description: VND nguyên đồng; BigDecimal/NUMERIC(14,2) ở server; không float, không nhận giá từ FE.
        currencyCode:
          type: string
          const: VND
        expiresAt:
          type: string
          format: date-time
          pattern: Z$
        instructions:
          $ref: '#/components/schemas/PaymentInstructions'
        paidAt:
          oneOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
        createdAt:
          type: string
          format: date-time
          pattern: Z$
        updatedAt:
          type: string
          format: date-time
          pattern: Z$
        version:
          type: integer
          format: int64
          minimum: 0
        serverTime:
          type: string
          format: date-time
          pattern: Z$
      required:
      - id
      - purchaseId
      - status
      - displayStatus
      - provider
      - referenceCode
      - amount
      - currencyCode
      - expiresAt
      - instructions
      - paidAt
      - createdAt
      - updatedAt
      - version
      - serverTime
      description: instructions là snapshot hướng dẫn cũ, chỉ hiển thị QR để trả khi status/displayStatus PENDING và purchase
        còn hợp lệ; SUCCESS không phải lời mời trả thêm.
      allOf:
      - if:
          properties:
            status:
              const: SUCCESS
          required:
          - status
        then:
          properties:
            paidAt:
              type: string
              format: date-time
              pattern: Z$
      - if:
          properties:
            status:
              const: PENDING
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - PENDING
              - EXPIRED
            paidAt:
              type: 'null'
      - if:
          properties:
            status:
              const: SUCCESS
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - SUCCESS
      - if:
          properties:
            status:
              const: FAILED
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - FAILED
            paidAt:
              type: 'null'
      - if:
          properties:
            status:
              const: EXPIRED
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - EXPIRED
            paidAt:
              type: 'null'
      - if:
          properties:
            status:
              const: CANCELLED
          required:
          - status
        then:
          properties:
            displayStatus:
              enum:
              - CANCELLED
            paidAt:
              type: 'null'
    CurrentAttemptResponse:
      type: object
      additionalProperties: false
      properties:
        paymentAttempt:
          oneOf:
          - $ref: '#/components/schemas/PaymentAttemptView'
          - type: 'null'
        serverTime:
          type: string
          format: date-time
          pattern: Z$
      required:
      - paymentAttempt
      - serverTime
      description: Attempt mới nhất của purchase theo createdAt DESC,id DESC, có thể terminal; null khi chưa từng tạo. Không
        chỉ query status=PENDING.
    OnboardingResponse:
      type: object
      additionalProperties: false
      properties:
        subscriptionState:
          $ref: '#/components/schemas/SubscriptionState'
        currentSubscription:
          oneOf:
          - $ref: '#/components/schemas/SubscriptionSummary'
          - type: 'null'
        currentPurchase:
          oneOf:
          - $ref: '#/components/schemas/PurchaseView'
          - type: 'null'
        unresolvedPaymentReviewCount:
          type: integer
          minimum: 0
        canPurchase:
          type: boolean
        blockedReason:
          oneOf:
          - $ref: '#/components/schemas/BlockedReason'
          - type: 'null'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Action'
        serverTime:
          type: string
          format: date-time
          pattern: Z$
      required:
      - subscriptionState
      - currentSubscription
      - currentPurchase
      - unresolvedPaymentReviewCount
      - canPurchase
      - blockedReason
      - allowedActions
      - serverTime
      allOf:
      - if:
          properties:
            canPurchase:
              const: true
          required:
          - canPurchase
        then:
          properties:
            blockedReason:
              type: 'null'
      - if:
          properties:
            canPurchase:
              const: false
          required:
          - canPurchase
        then:
          properties:
            blockedReason:
              $ref: '#/components/schemas/BlockedReason'
    CreatePurchaseRequest:
