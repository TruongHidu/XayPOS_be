  /admin/subscription-payment-events/{eventId}/reconcile:
    post:
      operationId: reconcileSubscriptionPaymentEvent
      summary: '[PLANNED] Yêu cầu đối soát lại hoặc đóng xử lý ngoài hệ thống'
      description: Chỉ event REVIEW_REQUIRED và expectedVersion hiện tại. RECHECK queue RETRY_PENDING trả202, không khẳng
        định đã trả/activated; cùng settlement guard, không sửa amount/ref/tenant. CLOSE_OFFLINE cần reason tối thiểu10ký
        tự và resolutionReference, trả200 CLOSED. Không tạo refund/tiền giả; purchase REVIEW_REQUIRED chỉ CLOSED khi không
        còn event review/retry/processing liên quan, giữ mọi paid evidence. Purchase ACTIVATED không đổi. Retry request sau
        timeout GET list và kiểm tra version; stale version409, không audit lần hai. Không Idempotency-Key, không đường tắt
        force PAID.
      tags:
      - Subscription payment review
      x-implementation-status: PLANNED
      x-target-phase: 5
      x-required-permissions:
      - SUBSCRIPTION_PAYMENT_REVIEW
      x-required-role: SYSTEM_SUPER_ADMIN
      security:
      - bearerAuth: []
      x-tenant-policy: System SUPER_ADMIN restaurantId=null; system-wide query.
      x-cache-policy: 'Cache-Control: no-store; Vary: Authorization.'
      x-idempotency-policy: Theo description; guard trước replay và business mutation.
      parameters:
      - name: eventId
        in: path
        required: true
        description: Event system-wide, chỉ system SUPER_ADMIN có quyền review.
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Đã queue, chưa phải settlement thành công.
          headers:
            Cache-Control:
              description: Luôn no-store.
