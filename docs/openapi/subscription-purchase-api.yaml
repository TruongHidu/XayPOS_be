                    success: false
                    code: PACKAGE_NOT_PURCHASABLE
                    message: Gói giá <=0, tiền không nguyên VND hoặc currency không hỗ trợ.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '500':
          description: 'INTERNAL_ERROR: Lỗi ngoài dự kiến theo GlobalExceptionHandler; không tiết lộ chi tiết nội bộ. Mutation
            timeout/lỗi cần GET/retry đúng key.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    success: false
                    code: INTERNAL_ERROR
                    message: Lỗi ngoài dự kiến theo GlobalExceptionHandler; không tiết lộ chi tiết nội bộ. Mutation timeout/lỗi
                      cần GET/retry đúng key.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '503':
          description: 'PURCHASE_UNAVAILABLE: đang tắt nhận ý định mới; đọc/replay/cancel vẫn hoạt động.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PURCHASE_UNAVAILABLE:
                  value:
                    success: false
                    code: PURCHASE_UNAVAILABLE
