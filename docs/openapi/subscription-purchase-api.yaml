openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: POS SaaS Subscription Purchase — Phase 4
  version: 0.4.0
  description: Phase2 đã hiện thực 5 API onboarding/purchase/read/cancel và migration V41. Phase3 đã hiện thực 2 API payment attempt/QR
    SePay và V42 (mã PS + 20 HEX). Phase4 đã hiện thực webhook SePay HMAC, worker đối chiếu PAID và kích hoạt gói từ quote. Phase5 đối soát API và admin review vẫn PLANNED. Mặc định accept-new=false; chưa có thanh toán SaaS chạy thật. Xem subscription-purchase-api.md
    và thiết kế/test plan/FE sync. Ví dụ tài khoản/QR là DEMO, không dùng chuyển tiền.
x-implementation-status: PARTIALLY_IMPLEMENTED
servers:
- url: http://localhost:8080/api/v1
  description: Base URL local; tám operation IMPLEMENTED đã có runtime, hai operation admin review Phase5 vẫn PLANNED.
tags:
- name: Subscription purchase
- name: SePay subscription webhook
- name: Subscription payment review
security:
- bearerAuth: []
paths:
  /subscriptions/onboarding:
    get:
      operationId: getSubscriptionOnboarding
      summary: '[IMPLEMENTED] Trạng thái đăng ký/mua gói của OWNER'
      description: '200 khi owner chưa có subscription. Subscription và purchase/review độc lập. GET project ACTIVE quá endAt
        thành subscriptionState EXPIRED nhưng currentSubscription.status giữ ACTIVE; không ghi expiry/audit. canPurchase/allowedActions
        chỉ gợi ý. Feature flag off không chặn đọc. CurrentPurchase chọn open purchase kể cả stale PENDING_PAYMENT; displayStatus
        cho biết expiry. Review count độc lập cả khi đã ACTIVE. allowedActions chỉ có CREATE_PAYMENT_ATTEMPT khi purchase PENDING_PAYMENT, owner có quyền CREATE, accept-new bật và SePay đã cấu hình. Quyền từ JWT phải có và vẫn còn hiệu lực trong DB; đổi quyền cần refresh/login lại.'
      tags:
      - Subscription purchase
      x-implementation-status: IMPLEMENTED
      x-target-phase: 2
      x-required-permissions:
      - SUBSCRIPTION_PURCHASE_VIEW
      x-required-role: OWNER
      security:
      - bearerAuth: []
      x-tenant-policy: Principal tenant only; cross-tenant UUID=404.
      x-cache-policy: 'Cache-Control: no-store; Vary: Authorization.'
      x-idempotency-policy: Read-only; không reconcile/write/audit trên GET.
      parameters: []
      responses:
        '200':
          description: Thành công.
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponse'
              examples:
                noSubscription:
                  value:
                    subscriptionState: NONE
                    currentSubscription: null
                    currentPurchase: null
                    unresolvedPaymentReviewCount: 0
                    canPurchase: true
                    blockedReason: null
                    allowedActions:
                    - CREATE_PURCHASE
                    serverTime: '2026-11-01T03:00:00Z'
                activeWithExtraPaymentReview:
                  value:
                    subscriptionState: ACTIVE
                    currentSubscription:
                      id: 44444444-4444-4444-8444-444444444444
                      status: ACTIVE
                      effective: true
                      packageCode: PRO
                      startAt: '2026-11-01T03:06:00Z'
                      endAt: '2026-12-01T03:06:00Z'
                      activatedAt: '2026-11-01T03:06:00Z'
                    currentPurchase: null
                    unresolvedPaymentReviewCount: 1
                    canPurchase: false
                    blockedReason: SUBSCRIPTION_ALREADY_ACTIVE
                    allowedActions:
                    - OPEN_APP
                    serverTime: '2026-11-01T03:10:00Z'
                waitingPayment:
                  value:
                    subscriptionState: NONE
                    currentSubscription: null
                    currentPurchase:
                      id: 11111111-1111-4111-8111-111111111111
                      status: PENDING_PAYMENT
                      displayStatus: PENDING_PAYMENT
                      quote:
                        schemaVersion: 1
                        packageId: 66666666-6666-4666-8666-666666666666
                        packageCode: PRO
                        packageName: Pro
                        priceAmount: 399000
                        currencyCode: VND
                        billingCycleMonths: 1
                        features:
                        - code: MENU_MANAGEMENT
                          limits: {}
                        - code: RECIPE_MANAGEMENT
                          limits: {}
                        maxStaff: 30
                        quotedAt: '2026-11-01T03:00:00Z'
                        expiresAt: '2026-11-01T03:15:00Z'
                        billingZoneId: Asia/Ho_Chi_Minh
                      subscriptionId: null
                      paidAt: null
                      activatedAt: null
                      cancelledAt: null
                      closedAt: null
                      reviewReason: null
                      allowedActions:
                      - VIEW_PURCHASE
                      - CANCEL_PURCHASE
                      createdAt: '2026-11-01T03:00:00Z'
                      updatedAt: '2026-11-01T03:00:00Z'
                      version: 0
                      serverTime: '2026-11-01T03:00:00Z'
                    unresolvedPaymentReviewCount: 0
                    canPurchase: false
                    blockedReason: PURCHASE_IN_PROGRESS
                    allowedActions:
                    - VIEW_PURCHASE
                    - CANCEL_PURCHASE
                    serverTime: '2026-11-01T03:00:00Z'
        '400':
          description: 'VALIDATION_ERROR: Thiếu/sai header, query, path UUID, body field hoặc range.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: Thiếu/sai header, query, path UUID, body field hoặc range.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '401':
          description: 'UNAUTHORIZED: Thiếu/không hợp lệ access token. ACCOUNT_INACTIVE: Account không còn hợp lệ; convention
            UserAccountStatusFilter hiện có.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
            WWW-Authenticate:
              description: Bearer cho owner/admin; HMAC cho webhook.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    code: UNAUTHORIZED
                    message: Thiếu/không hợp lệ access token.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                ACCOUNT_INACTIVE:
                  value:
                    success: false
                    code: ACCOUNT_INACTIVE
                    message: Account không còn hợp lệ; convention UserAccountStatusFilter hiện có.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '403':
          description: 'FORBIDDEN: Sai role hoặc thiếu permission. RESTAURANT_INACTIVE: Restaurant inactive/suspended/không
            hợp lệ; không bypass tenant guard.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    code: FORBIDDEN
                    message: Sai role hoặc thiếu permission.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                RESTAURANT_INACTIVE:
                  value:
                    success: false
                    code: RESTAURANT_INACTIVE
                    message: Restaurant inactive/suspended/không hợp lệ; không bypass tenant guard.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '500':
          description: 'INTERNAL_ERROR: Lỗi ngoài dự kiến theo GlobalExceptionHandler; không tiết lộ chi tiết nội bộ. Mutation
            timeout/lỗi cần GET/retry đúng key.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INTERNAL_ERROR:
                  value:
                    success: false
                    code: INTERNAL_ERROR
                    message: Lỗi ngoài dự kiến theo GlobalExceptionHandler; không tiết lộ chi tiết nội bộ. Mutation timeout/lỗi
                      cần GET/retry đúng key.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
  /subscription-purchases:
    post:
      operationId: createSubscriptionPurchase
      summary: '[IMPLEMENTED] Tạo purchase và quote bất biến'
      description: 'Body chỉ packageCode; unknown fields400. Chuẩn hóa trim/uppercase. Restaurant lock, REPEATABLE_READ quote;
        reconcile due ACTIVE/open purchase trước ý định mới. Chặn ACTIVE/PENDING/open purchase. 201 insert mới,200 replay
        original body. Same key khác canonical payload409. Replay sau ACTIVATED vẫn200 trước active eligibility. Flag off
        chỉ chặn ý định mới, không chặn replay. Không tạo subscription PENDING. allowedActions chỉ có CREATE_PAYMENT_ATTEMPT khi purchase PENDING_PAYMENT, owner có quyền CREATE, accept-new bật và SePay đã cấu hình. Quyền từ JWT phải có và vẫn còn hiệu lực trong DB; đổi quyền cần refresh/login
        lại.'
      tags:
      - Subscription purchase
      x-implementation-status: IMPLEMENTED
      x-target-phase: 2
      x-required-permissions:
      - SUBSCRIPTION_PURCHASE_CREATE
      x-required-role: OWNER
      security:
      - bearerAuth: []
      x-tenant-policy: Principal tenant only; cross-tenant UUID=404.
      x-cache-policy: 'Cache-Control: no-store; Vary: Authorization.'
      x-idempotency-policy: Theo description; guard trước replay và business mutation.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Bắt buộc. Cùng ý định phải dùng lại key sau timeout/reload; scope tenant+command. Access guard trước
          replay, replay trước eligibility.
        schema:
          type: string
          minLength: 8
          maxLength: 100
          pattern: ^[A-Za-z0-9._:-]+$
      responses:
        '201':
          description: Mới tạo; Idempotency-Replayed=false.
          headers:
            Idempotency-Replayed:
              description: false=insert mới; true=replay original body.
              schema:
                type: boolean
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseView'
              examples:
                created:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    status: PENDING_PAYMENT
                    displayStatus: PENDING_PAYMENT
                    quote:
                      schemaVersion: 1
                      packageId: 66666666-6666-4666-8666-666666666666
                      packageCode: PRO
                      packageName: Pro
                      priceAmount: 399000
                      currencyCode: VND
                      billingCycleMonths: 1
                      features:
                      - code: MENU_MANAGEMENT
                        limits: {}
                      - code: RECIPE_MANAGEMENT
                        limits: {}
                      maxStaff: 30
                      quotedAt: '2026-11-01T03:00:00Z'
                      expiresAt: '2026-11-01T03:15:00Z'
                      billingZoneId: Asia/Ho_Chi_Minh
                    subscriptionId: null
                    paidAt: null
                    activatedAt: null
                    cancelledAt: null
                    closedAt: null
                    reviewReason: null
                    allowedActions:
                    - VIEW_PURCHASE
                    - CANCEL_PURCHASE
                    createdAt: '2026-11-01T03:00:00Z'
                    updatedAt: '2026-11-01T03:00:00Z'
                    version: 0
                    serverTime: '2026-11-01T03:00:00Z'
        '200':
          description: Original creation body; Idempotency-Replayed=true; GET để biết trạng thái mới.
          headers:
            Idempotency-Replayed:
              description: false=insert mới; true=replay original body.
              schema:
                type: boolean
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseView'
              examples:
                replayed:
                  value:
                    id: 11111111-1111-4111-8111-111111111111
                    status: PENDING_PAYMENT
                    displayStatus: PENDING_PAYMENT
                    quote:
                      schemaVersion: 1
                      packageId: 66666666-6666-4666-8666-666666666666
                      packageCode: PRO
                      packageName: Pro
                      priceAmount: 399000
                      currencyCode: VND
                      billingCycleMonths: 1
                      features:
                      - code: MENU_MANAGEMENT
                        limits: {}
                      - code: RECIPE_MANAGEMENT
                        limits: {}
                      maxStaff: 30
                      quotedAt: '2026-11-01T03:00:00Z'
                      expiresAt: '2026-11-01T03:15:00Z'
                      billingZoneId: Asia/Ho_Chi_Minh
                    subscriptionId: null
                    paidAt: null
                    activatedAt: null
                    cancelledAt: null
                    closedAt: null
                    reviewReason: null
                    allowedActions:
                    - VIEW_PURCHASE
                    - CANCEL_PURCHASE
                    createdAt: '2026-11-01T03:00:00Z'
                    updatedAt: '2026-11-01T03:00:00Z'
                    version: 0
                    serverTime: '2026-11-01T03:00:00Z'
        '400':
          description: 'VALIDATION_ERROR: Thiếu/sai header, query, path UUID, body field hoặc range. INVALID_REQUEST_BODY:
            JSON lỗi, sai kiểu hoặc unknown business field.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    success: false
                    code: VALIDATION_ERROR
                    message: Thiếu/sai header, query, path UUID, body field hoặc range.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                INVALID_REQUEST_BODY:
                  value:
                    success: false
                    code: INVALID_REQUEST_BODY
                    message: JSON lỗi, sai kiểu hoặc unknown business field.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '401':
          description: 'UNAUTHORIZED: Thiếu/không hợp lệ access token. ACCOUNT_INACTIVE: Account không còn hợp lệ; convention
            UserAccountStatusFilter hiện có.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
            WWW-Authenticate:
              description: Bearer cho owner/admin; HMAC cho webhook.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    code: UNAUTHORIZED
                    message: Thiếu/không hợp lệ access token.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                ACCOUNT_INACTIVE:
                  value:
                    success: false
                    code: ACCOUNT_INACTIVE
                    message: Account không còn hợp lệ; convention UserAccountStatusFilter hiện có.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '403':
          description: 'FORBIDDEN: Sai role hoặc thiếu permission. RESTAURANT_INACTIVE: Restaurant inactive/suspended/không
            hợp lệ; không bypass tenant guard.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    code: FORBIDDEN
                    message: Sai role hoặc thiếu permission.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                RESTAURANT_INACTIVE:
                  value:
                    success: false
                    code: RESTAURANT_INACTIVE
                    message: Restaurant inactive/suspended/không hợp lệ; không bypass tenant guard.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '404':
          description: 'PACKAGE_NOT_FOUND: Package không tồn tại hoặc inactive tại quote mới.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PACKAGE_NOT_FOUND:
                  value:
                    success: false
                    code: PACKAGE_NOT_FOUND
                    message: Package không tồn tại hoặc inactive tại quote mới.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '409':
          description: 'SUBSCRIPTION_ALREADY_ACTIVE: Đang có subscription ACTIVE chưa hết hạn, kể cả future ACTIVE; MVP không
            renewal/change. SUBSCRIPTION_PENDING_EXISTS: Subscription PENDING của admin phải activate/cancel trước. PURCHASE_IN_PROGRESS:
            Đã có purchase mở; đọc onboarding/current purchase để tiếp tục. PURCHASE_REVIEW_REQUIRED: Purchase đang cần admin
            đối soát; không thu tiền lần nữa. IDEMPOTENCY_KEY_REUSED: Cùng key khác canonical request hoặc purchaseId. CONCURRENT_SUBSCRIPTION_UPDATE:
            Version/constraint/serialization conflict; GET lại, retry ý định cũ bằng key cũ.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SUBSCRIPTION_ALREADY_ACTIVE:
                  value:
                    success: false
                    code: SUBSCRIPTION_ALREADY_ACTIVE
                    message: Đang có subscription ACTIVE chưa hết hạn, kể cả future ACTIVE; MVP không renewal/change.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                SUBSCRIPTION_PENDING_EXISTS:
                  value:
                    success: false
                    code: SUBSCRIPTION_PENDING_EXISTS
                    message: Subscription PENDING của admin phải activate/cancel trước.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                PURCHASE_IN_PROGRESS:
                  value:
                    success: false
                    code: PURCHASE_IN_PROGRESS
                    message: Đã có purchase mở; đọc onboarding/current purchase để tiếp tục.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                PURCHASE_REVIEW_REQUIRED:
                  value:
                    success: false
                    code: PURCHASE_REVIEW_REQUIRED
                    message: Purchase đang cần admin đối soát; không thu tiền lần nữa.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    success: false
                    code: IDEMPOTENCY_KEY_REUSED
                    message: Cùng key khác canonical request hoặc purchaseId.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
                CONCURRENT_SUBSCRIPTION_UPDATE:
                  value:
                    success: false
                    code: CONCURRENT_SUBSCRIPTION_UPDATE
                    message: Version/constraint/serialization conflict; GET lại, retry ý định cũ bằng key cũ.
                    fieldErrors: {}
                    timestamp: '2026-11-01T03:00:00Z'
        '422':
          description: 'PACKAGE_NOT_PURCHASABLE: Gói giá <=0, tiền không nguyên VND hoặc currency không hỗ trợ.'
          headers:
            Cache-Control:
              description: Luôn no-store.
              schema:
                type: string
                const: no-store
            Vary:
              description: Vary chứa Authorization; có thể kèm các header CORS khác.
              schema:
                type: string
          content:
