    post:
      operationId: createSubscriptionPaymentAttempt
      summary: '[IMPLEMENTED] Tạo QR attempt cho purchase còn hạn'
      description: JSON {}. Key scope tenant+CREATE_PAYMENT_ATTEMPT, fingerprint gồm purchaseId. Cùng key replay200 original
        attempt kể cả sau expiry; FE GET trước hiển thị QR. Key mới khi đã có PENDING trả409 PAYMENT_ATTEMPT_PENDING, không
        tạo attempt thứ hai. Attempt.expiresAt bằng quote.expiresAt; không kéo dài hạn. Instructions account nền tảng; QR
        mẫu chỉ DEMO. Phase3 chưa có webhook thì không bật public purchase flow production.
      tags:
      - Subscription purchase
      x-implementation-status: IMPLEMENTED
      x-target-phase: 3
      x-required-permissions:
      - SUBSCRIPTION_PURCHASE_CREATE
      x-required-role: OWNER
      security:
      - bearerAuth: []
      x-tenant-policy: Principal tenant only; cross-tenant UUID=404.
      x-cache-policy: 'Cache-Control: no-store; Vary: Authorization.'
      x-idempotency-policy: Theo description; guard trước replay và business mutation.
      parameters:
      - name: purchaseId
        in: path
        required: true
        description: Purchase thuộc tenant từ principal, khác tenant trả404.
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: Bắt buộc. Cùng ý định phải dùng lại key sau timeout/reload; scope tenant+command. Access guard trước
          replay, replay trước eligibility.
