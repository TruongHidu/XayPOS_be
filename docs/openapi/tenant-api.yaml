openapi: "3.0.3"
info:
  title: "POS SaaS Tenant Phase 1 API"
  version: "1.0.0"
  description: "Restaurant profile and staff administration. Tenant is derived from JWT. Disabled accounts are checked on protected bearer requests. Role/permission JWT claims may remain stale until access TTL expires (default 15 minutes); security changes revoke refresh tokens. maxStaff is a package-level positive integer or null (unlimited), captured at the root of immutable snapshot v2. Legacy v1 reads STAFF_MANAGEMENT.limits.maxStaff with absent key meaning unlimited. STAFF_MANAGEMENT remains required independently. Staff count excludes OWNER. No password reset, invitation, owner transfer or custom role management."
security:
  -
    bearerAuth: []
paths:
  "/api/v1/inventory/audits": {"get":{"tags":["Inventory stock audits"],"operationId":"listStockAudits","description":"Requires INVENTORY_VIEW, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. Read-only header totals; no embedded items. createdFrom inclusive, createdTo exclusive; from must be before to. Literal substring q.","security":[{"bearerAuth":[]}],"parameters":[{"name":"q","in":"query","schema":{"type":"string","maxLength":100}},{"name":"warehouseId","in":"query","schema":{"type":"string","format":"uuid"}},{"name":"status","in":"query","schema":{"type":"string","enum":["DRAFT","COUNTING","CONFIRMED","CANCELLED"]}},{"name":"createdFrom","in":"query","schema":{"type":"string","format":"date-time"}},{"name":"createdTo","in":"query","schema":{"type":"string","format":"date-time"}},{"name":"page","in":"query","schema":{"type":"integer","minimum":0,"default":0}},{"name":"size","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"sortBy","in":"query","schema":{"type":"string","enum":["createdAt","startedAt","updatedAt","auditCode"],"default":"createdAt"}},{"name":"direction","in":"query","schema":{"type":"string","enum":["asc","desc"],"default":"desc"}}],"responses":{"200":{"description":"Current persisted result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditPage"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}},"post":{"tags":["Inventory stock audits"],"operationId":"createStockAudit","description":"Requires INVENTORY_VIEW and STOCK_AUDIT_MANAGE, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. Creates header only, no stock snapshot. Same key/payload replays; different payload returns IDEMPOTENCY_KEY_REUSED.","security":[{"bearerAuth":[]}],"parameters":[{"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string","maxLength":100}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditCreate"}}}},"responses":{"201":{"description":"DRAFT created or idempotent replay","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditDetail"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}}
  "/api/v1/inventory/audits/{auditId}": {"get":{"tags":["Inventory stock audits"],"operationId":"getStockAudit","description":"Requires INVENTORY_VIEW, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. ","security":[{"bearerAuth":[]}],"parameters":[{"name":"auditId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Current persisted result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditDetail"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}},"patch":{"tags":["Inventory stock audits"],"operationId":"updateStockAudit","description":"Requires INVENTORY_VIEW and STOCK_AUDIT_MANAGE, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. ","security":[{"bearerAuth":[]}],"parameters":[{"name":"auditId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditNote"}}}},"responses":{"200":{"description":"Current persisted result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditDetail"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}}
  "/api/v1/inventory/audits/{auditId}/items": {"get":{"tags":["Inventory stock audits"],"operationId":"listStockAuditItems","description":"Requires INVENTORY_VIEW, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. ","security":[{"bearerAuth":[]}],"parameters":[{"name":"auditId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"q","in":"query","schema":{"type":"string","maxLength":100}},{"name":"counted","in":"query","schema":{"type":"boolean"}},{"name":"differenceOnly","in":"query","schema":{"type":"boolean","default":false}},{"name":"page","in":"query","schema":{"type":"integer","minimum":0,"default":0}},{"name":"size","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"sortBy","in":"query","schema":{"type":"string","enum":["name","sku","systemQuantity","countedQuantity","differenceQuantity"],"default":"name"}},{"name":"direction","in":"query","schema":{"type":"string","enum":["asc","desc"],"default":"asc"}}],"responses":{"200":{"description":"Current persisted result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditItemPage"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}},"patch":{"tags":["Inventory stock audits"],"operationId":"countStockAuditItems","description":"Requires INVENTORY_VIEW and STOCK_AUDIT_MANAGE, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. COUNTING only. Up to 100 unique auditItemId per request. Atomic batch, one header version increment for changes; no-op still checks expectedVersion. Null count is invalid, zero is counted. Omitted/null line note preserves, blank clears.","security":[{"bearerAuth":[]}],"parameters":[{"name":"auditId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditCounts"}}}},"responses":{"200":{"description":"Current persisted result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditDetail"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}}
  "/api/v1/inventory/audits/{auditId}/start": {"post":{"tags":["Inventory stock audits"],"operationId":"startStockAudit","description":"Requires INVENTORY_VIEW and STOCK_AUDIT_MANAGE, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. DRAFT -> COUNTING snapshots all tracked undeleted ingredients, including inactive/logical zero. Does not freeze warehouse. COUNTING replay is idempotent before version check, never refreshes counts.","security":[{"bearerAuth":[]}],"parameters":[{"name":"auditId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditTransition"}}}},"responses":{"200":{"description":"Current persisted result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditDetail"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}}
  "/api/v1/inventory/audits/{auditId}/confirm": {"post":{"tags":["Inventory stock audits"],"operationId":"confirmStockAudit","description":"Requires INVENTORY_VIEW and STOCK_AUDIT_CONFIRM, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. COUNTING -> CONFIRMED atomically checks physical quantity, ledger movement count, eligibility/unit and CURRENT reservations. Any physical movement makes snapshot stale, even net-zero movement. Confirmed replay is idempotent before version/staleness checks. Internal ADJUSTMENT requires no INVENTORY_ADJUST. Zero delta for every row produces no document.","security":[{"bearerAuth":[]}],"parameters":[{"name":"auditId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditTransition"}}}},"responses":{"200":{"description":"Current persisted result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditDetail"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}}
  "/api/v1/inventory/audits/{auditId}/cancel": {"post":{"tags":["Inventory stock audits"],"operationId":"cancelStockAudit","description":"Requires INVENTORY_VIEW and STOCK_AUDIT_MANAGE, INVENTORY_MANAGEMENT and STOCK_AUDIT. Tenant derived from JWT. DRAFT/COUNTING -> CANCELLED preserves snapshots and stock; CANCELLED replay is idempotent before version check. CONFIRMED cannot cancel.","security":[{"bearerAuth":[]}],"parameters":[{"name":"auditId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditNote"}}}},"responses":{"200":{"description":"Current persisted result","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockAuditDetail"}}}},"400":{"description":"Invalid input or reserved idempotency namespace","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"401":{"description":"Unauthenticated or inactive account","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"403":{"description":"Missing permission, feature, effective subscription or active tenant","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"404":{"description":"STOCK_AUDIT_NOT_FOUND / STOCK_AUDIT_ITEM_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"409":{"description":"Invalid transition, concurrent update, incomplete/stale snapshot, warehouse in progress/inactive, reserved stock invariant or adjustment overflow","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}}}
  "/api/v1/inventory/alerts":
    get:
      tags: ["Inventory alerts"]
      operationId: "listLowStockAlerts"
      description: "Requires INVENTORY_VIEW, INVENTORY_MANAGEMENT and LOW_STOCK_ALERT. Tenant comes from JWT. Read-only persisted physical-low episodes; absent status returns all statuses. Current metrics never mutate the alert. Historical snapshots remain visible after source soft deletion. No public QR access. No scheduler or notification delivery."
      security: [{bearerAuth: []}]
      parameters:
        - {name: "warehouseId", in: "query", schema: {type: "string", format: "uuid"}}
        - {name: "ingredientId", in: "query", schema: {type: "string", format: "uuid"}}
        - {name: "status", in: "query", schema: {type: "string", enum: ["OPEN", "ACKNOWLEDGED", "RESOLVED"]}}
        - {name: "q", in: "query", description: "Literal substring of trigger ingredient name/SKU", schema: {type: "string", maxLength: 100}}
        - {name: "triggeredFrom", in: "query", description: "Inclusive; must be before triggeredTo", schema: {type: "string", format: "date-time"}}
        - {name: "triggeredTo", in: "query", description: "Exclusive", schema: {type: "string", format: "date-time"}}
        - {name: "page", in: "query", schema: {type: "integer", minimum: 0, default: 0}}
        - {name: "size", in: "query", schema: {type: "integer", minimum: 1, maximum: 100, default: 20}}
        - {name: "sortBy", in: "query", schema: {type: "string", enum: ["triggeredAt", "updatedAt"], default: "triggeredAt"}}
        - {name: "direction", in: "query", schema: {type: "string", enum: ["asc", "desc"], default: "desc"}}
      responses:
        "200":
          description: "Alert page; stable ID tie-breaker, not a live low-stock balance page"
          headers: {Cache-Control: {schema: {type: "string", example: "no-store"}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/LowStockAlertPage"}}}
        "400": {description: "VALIDATION_ERROR"}
        "401": {description: "UNAUTHORIZED or ACCOUNT_INACTIVE"}
        "403": {description: "FORBIDDEN, FEATURE_NOT_ENTITLED, SUBSCRIPTION_NOT_ACTIVE or restaurant guard"}
  "/api/v1/inventory/alerts/{alertId}":
    get:
      tags: ["Inventory alerts"]
      operationId: "getLowStockAlert"
      description: "Requires INVENTORY_VIEW, INVENTORY_MANAGEMENT and LOW_STOCK_ALERT. JWT tenant-scoped immutable trigger metadata with separately named live balance metrics. Missing/foreign-tenant alerts return 404; source soft deletion does not hide history."
      security: [{bearerAuth: []}]
      parameters:
        - {name: "alertId", in: "path", required: true, schema: {type: "string", format: "uuid"}}
      responses:
        "200":
          description: "Shortage episode"
          headers: {Cache-Control: {schema: {type: "string", example: "no-store"}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/LowStockAlert"}}}
        "400": {description: "VALIDATION_ERROR"}
        "401": {description: "UNAUTHORIZED or ACCOUNT_INACTIVE"}
        "403": {description: "FORBIDDEN, FEATURE_NOT_ENTITLED or SUBSCRIPTION_NOT_ACTIVE"}
        "404": {description: "LOW_STOCK_ALERT_NOT_FOUND"}
  "/api/v1/inventory/alerts/{alertId}/acknowledge":
    post:
      tags: ["Inventory alerts"]
      operationId: "acknowledgeLowStockAlert"
      description: "Requires INVENTORY_VIEW and INVENTORY_ALERT_ACKNOWLEDGE plus INVENTORY_MANAGEMENT and LOW_STOCK_ALERT. OPEN requires matching expectedVersion; ACKNOWLEDGED replay is idempotent even with the first request's stale version, preserving original actor/time/version/audit. RESOLVED cannot be acknowledged. Does not change stock or mark it recovered. No Idempotency-Key needed."
      security: [{bearerAuth: []}]
      parameters:
        - {name: "alertId", in: "path", required: true, schema: {type: "string", format: "uuid"}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LowStockAlertAcknowledge"}}}
      responses:
        "200":
          description: "Acknowledged or unchanged desired-state replay"
          headers: {Cache-Control: {schema: {type: "string", example: "no-store"}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/LowStockAlert"}}}
        "400": {description: "VALIDATION_ERROR or INVALID_REQUEST_BODY"}
        "401": {description: "UNAUTHORIZED or ACCOUNT_INACTIVE"}
        "403": {description: "FORBIDDEN, FEATURE_NOT_ENTITLED or SUBSCRIPTION_NOT_ACTIVE"}
        "404": {description: "LOW_STOCK_ALERT_NOT_FOUND"}
        "409": {description: "INVALID_LOW_STOCK_ALERT_TRANSITION or CONCURRENT_LOW_STOCK_ALERT_UPDATE"}
  "/api/v1/inventory/orders/{orderId}/items/{orderItemId}/allocation":
    get:
      tags: ["Inventory"]
      operationId: "getOrderItemInventoryAllocation"
      description: "Requires ORDER_VIEW, RECIPE_VIEW and INVENTORY_VIEW plus effective ORDER_MANAGEMENT, RECIPE_MANAGEMENT and INVENTORY_MANAGEMENT. Existing account/restaurant/subscription guards apply. Tenant derives from JWT; item must belong to this order. Read-only persisted allocation and ingredient snapshots; no live recipe lookup, mutation or actual order cost. DRAFT returns response-only NOT_SUBMITTED; durable SKIPPED retains its reason. Public QR has no access."
      security: [{bearerAuth: []}]
      parameters:
        - {name: "orderId", in: "path", required: true, schema: {type: "string", format: "uuid"}}
        - {name: "orderItemId", in: "path", required: true, schema: {type: "string", format: "uuid"}}
      responses:
        "200":
          description: "Immutable allocation or response-only NOT_SUBMITTED"
          headers: {Cache-Control: {schema: {type: "string", example: "no-store"}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/OrderItemInventoryAllocation"}}}
        "400": {description: "VALIDATION_ERROR or INVALID_REQUEST_BODY"}
        "401": {description: "UNAUTHORIZED or ACCOUNT_INACTIVE"}
        "403": {description: "FORBIDDEN, FEATURE_NOT_ENTITLED or existing tenant/subscription guard"}
        "404": {description: "ORDER_NOT_FOUND or ORDER_ITEM_NOT_FOUND; foreign tenants and wrong-order items are hidden"}
        "409": {description: "INVENTORY_ALLOCATION_NOT_FOUND, INVENTORY_ALLOCATION_CONFLICT or INVENTORY_RESERVATION_INVARIANT_VIOLATION"}
  "/api/v1/inventory/warehouses":
    get:
      tags: ["Inventory"]
      operationId: "listWarehouses"
      description: "Requires INVENTORY_VIEW and effective INVENTORY_MANAGEMENT. Tenant derives from JWT. Soft-deleted warehouses are excluded."
      parameters: [{"name":"q","in":"query","schema":{"type":"string","maxLength":100}},{"name":"active","in":"query","schema":{"type":"boolean"}},{"name":"page","in":"query","schema":{"type":"integer","minimum":0,"default":0}},{"name":"size","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"sortBy","in":"query","schema":{"type":"string","enum":["code","name","createdAt","updatedAt"],"default":"createdAt"}},{"name":"direction","in":"query","schema":{"type":"string","enum":["asc","desc"],"default":"desc"}}]
      responses: {"200":{"description":"Warehouse page","content":{"application/json":{"schema":{"$ref":"#/components/schemas/WarehousePage"}}}},"403":{"description":"FORBIDDEN, SUBSCRIPTION_NOT_ACTIVE or FEATURE_NOT_ENTITLED","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
    post:
      tags: ["Inventory"]
      operationId: "createWarehouse"
      description: "Requires WAREHOUSE_CREATE and INVENTORY_MANAGEMENT. First warehouse is automatically active/default; later warehouses are active/non-default."
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/WarehouseCreate"}}}}
      responses: {"201":{"description":"Created","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Warehouse"}}}},"409":{"description":"WAREHOUSE_CODE_EXISTS or CONCURRENT_WAREHOUSE_UPDATE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  "/api/v1/inventory/warehouses/{warehouseId}":
    get:
      tags: ["Inventory"]
      operationId: "getWarehouse"
      parameters: [{"$ref":"#/components/parameters/WarehouseId"}]
      responses: {"200":{"description":"Warehouse","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Warehouse"}}}},"404":{"description":"WAREHOUSE_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
    patch:
      tags: ["Inventory"]
      operationId: "updateWarehouse"
      description: "Requires WAREHOUSE_UPDATE. Only code/name are mutable; normalized no-op does not increment version or audit."
      parameters: [{"$ref":"#/components/parameters/WarehouseId"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/WarehouseUpdate"}}}}
      responses: {"200":{"description":"Updated or unchanged","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Warehouse"}}}},"409":{"description":"WAREHOUSE_CODE_EXISTS or CONCURRENT_WAREHOUSE_UPDATE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
    delete:
      tags: ["Inventory"]
      operationId: "deleteWarehouse"
      description: "Requires WAREHOUSE_DELETE. Soft-delete is idempotent; rejects RESERVED allocations with WAREHOUSE_HAS_RESERVATIONS, non-zero stock and default deletion while another active warehouse exists."
      parameters: [{"$ref":"#/components/parameters/WarehouseId"},{"name":"expectedVersion","in":"query","required":true,"schema":{"type":"integer","format":"int64","minimum":0}}]
      responses: {"204":{"description":"Deleted or already deleted"},"409":{"description":"WAREHOUSE_HAS_STOCK, DEFAULT_WAREHOUSE_CANNOT_BE_DELETED or CONCURRENT_WAREHOUSE_UPDATE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  "/api/v1/inventory/warehouses/{warehouseId}/status":
    patch:
      tags: ["Inventory"]
      operationId: "setWarehouseStatus"
      description: "Requires WAREHOUSE_UPDATE. Warehouse with RESERVED allocations returns WAREHOUSE_HAS_RESERVATIONS; default or stocked warehouse also cannot be disabled. Desired-state replay is a no-op."
      parameters: [{"$ref":"#/components/parameters/WarehouseId"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/WarehouseStatus"}}}}
      responses: {"200":{"description":"Warehouse","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Warehouse"}}}},"409":{"description":"DEFAULT_WAREHOUSE_CANNOT_BE_DISABLED, WAREHOUSE_HAS_STOCK or CONCURRENT_WAREHOUSE_UPDATE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  "/api/v1/inventory/warehouses/{warehouseId}/make-default":
    post:
      tags: ["Inventory"]
      operationId: "makeDefaultWarehouse"
      description: "Requires WAREHOUSE_UPDATE. Atomically switches the active default under the restaurant lock. Existing allocations retain their original warehouse; new append acceptance may select the new default."
      parameters: [{"$ref":"#/components/parameters/WarehouseId"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/WarehouseMakeDefault"}}}}
      responses: {"200":{"description":"New/current default","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Warehouse"}}}},"409":{"description":"WAREHOUSE_INACTIVE or CONCURRENT_WAREHOUSE_UPDATE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  "/api/v1/inventory/warehouses/{warehouseId}/balances":
    get:
      tags: ["Inventory"]
      operationId: "listInventoryBalances"
      description: "Requires INVENTORY_VIEW and INVENTORY_MANAGEMENT. DB-paginated LEFT JOIN returns logical zero balances without writing rows."
      parameters: [{"$ref":"#/components/parameters/WarehouseId"},{"name":"q","in":"query","schema":{"type":"string","maxLength":100}},{"name":"ingredientActive","in":"query","schema":{"type":"boolean"}},{"name":"page","in":"query","schema":{"type":"integer","minimum":0,"default":0}},{"name":"size","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"sortBy","in":"query","schema":{"type":"string","enum":["ingredientName","sku","quantity","minQuantity","updatedAt"],"default":"ingredientName"}},{"name":"direction","in":"query","schema":{"type":"string","enum":["asc","desc"],"default":"asc"}}]
      responses: {"200":{"description":"Balance page","content":{"application/json":{"schema":{"$ref":"#/components/schemas/InventoryBalancePage"}}}},"404":{"description":"WAREHOUSE_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  "/api/v1/inventory/warehouses/{warehouseId}/balances/{ingredientId}":
    get:
      tags: ["Inventory"]
      operationId: "getInventoryBalance"
