        "name":
          "type": "string"
          "maxLength": 150
          "minLength": 1
        "sku":
          "type": "string"
          "maxLength": 80
          "nullable": true
        "baseUnit":
          "type": "string"
          "maxLength": 30
          "minLength": 1
        "description":
          "type": "string"
          "maxLength": 10000
          "nullable": true
        "imageUrl":
          "type": "string"
          "maxLength": 500
          "description": "Absolute HTTP(S) URL without credentials; empty string clears the value."
          "nullable": true
        "salePrice":
          "type": "number"
          "minimum": 0
