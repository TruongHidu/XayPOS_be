        "404": {"description":"MENU_ITEM_NOT_FOUND, RECIPE_NOT_FOUND or INGREDIENT_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "409": {"description":"RECIPE_NOT_ACTIVE, SAME_RECIPE_VERSION_NOT_ALLOWED, INGREDIENT_INACTIVE, DUPLICATE_RECIPE_INGREDIENT or CONCURRENT_RECIPE_UPDATE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
