        role:
          "$ref": "#/components/schemas/StaffRole"
        lastLoginAt:
          type: "string"
          format: "date-time"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "name"
        - "email"
        - "active"
        - "role"
        - "createdAt"
        - "updatedAt"
      example:
        id: "22222222-2222-4222-8222-222222222222"
        name: "Alice"
        email: "alice@example.com"
        phone: null
        active: true
        role:
          id: "33333333-3333-4333-8333-333333333333"
          code: "WAITER"
          name: "Waiter"
        lastLoginAt: null
        createdAt: "2026-09-22T00:00:00Z"
        updatedAt: "2026-09-22T00:00:00Z"
    StaffPage:
