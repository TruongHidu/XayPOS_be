  "/api/v1/inventory/stock-documents/{documentId}/confirm":
    post:
      tags: ["Inventory"]
      operationId: "confirmStockDocument"
      description: "Atomically posts every line, rejects negative stock and appends immutable ledger rows. Generated stockAuditId document returns 409 STOCK_DOCUMENT_MANAGED_BY_AUDIT BEFORE confirmed replay. RECEIPT also updates tracked INGREDIENT.costPrice using MOVING_WEIGHTED_AVERAGE: (pre-receipt physical quantity across ALL tenant warehouses * previous cost + received quantity * receipt unitCost) / final total quantity, rounded HALF_UP to 2 decimals. Zero previous quantity uses receipt unitCost; unitCost omitted/zero still means zero and participates in averaging. Restaurant and ordered ingredient locks prevent concurrent repricing; price, versions, stock, ledger and audit roll back together. ISSUE/ADJUSTMENT and drafts do not reprice. Ledger retains actual receipt unitCost. No sale price, menu-item cost or historical snapshot updates. V37: positive opening stock with costConfigured=false skips reference repricing and audits INGREDIENT_COST_RECALCULATION_SKIPPED / UNCONFIGURED_OPENING_REFERENCE_COST; it is never averaged as free stock. Zero opening stock establishes configured=true even for zero receipt unitCost. INGREDIENT_COST_RECALCULATED audit when price or configured state changes; manual confirmed replay is a no-op, including no repricing. Existing INVENTORY_RECEIVE permission is sufficient for this derived receipt effect. Refresh ingredient detail/version and recipe cost-estimate after confirmation."
      parameters: [{"$ref":"#/components/parameters/StockDocumentId"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockDocumentTransition"}}}}
      responses: {"200":{"description":"Confirmed or replayed document. ISSUE/ADJUSTMENT decrease must leave physical quantity >= reservedQuantity; receipt/increase preserve reservedQuantity. Weighted average uses physical quantity, never availableQuantity.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockDocumentDetail"}}}},"409":{"description":"STOCK_DOCUMENT_EMPTY, INSUFFICIENT_AVAILABLE_STOCK, INVALID_INVENTORY_COST_DATA, invalid transition or concurrent conflict","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  "/api/v1/inventory/stock-documents/{documentId}/cancel":
    post:
      tags: ["Inventory"]
      operationId: "cancelStockDocument"
      description: "Cancels manual DRAFT without posting inventory. Manual cancelled replay is a no-op. Generated stockAuditId document returns 409 STOCK_DOCUMENT_MANAGED_BY_AUDIT before replay."
      parameters: [{"$ref":"#/components/parameters/StockDocumentId"}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockDocumentTransition"}}}}
      responses: {"200":{"description":"Cancelled or replayed document","content":{"application/json":{"schema":{"$ref":"#/components/schemas/StockDocumentDetail"}}}}}
  "/api/v1/inventory/transactions":
    get:
      tags: ["Inventory"]
      operationId: "listInventoryTransactions"
      description: "Requires INVENTORY_VIEW and INVENTORY_MANAGEMENT. Read-only append-only ledger from STOCK_DOCUMENT or ORDER_ITEM snapshots. RECIPE_USE is negative physical usage with null document fields. V38 unitCost equals the exact frozen tracked usage reference price: known or configured zero is retained; unknown/legacy remains null. Never read today's catalogue at consume or update old ledger. An INCOMPLETE header can still have known-price tracked usages. This is not guaranteed actual COGS or order profit; tracked ledger excludes MANUAL/untracked costs. Null is not zero. Pagination/sorting occur in the database."
