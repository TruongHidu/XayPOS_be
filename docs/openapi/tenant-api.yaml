openapi: "3.0.3"
info:
  title: "POS SaaS Tenant Phase 1 API"
  version: "1.0.0"
  description: "Restaurant profile and staff administration. Tenant is derived from JWT. Disabled accounts are checked on protected bearer requests. Role/permission JWT claims may remain stale until access TTL expires (default 15 minutes); security changes revoke refresh tokens. maxStaff is a package-level positive integer or null (unlimited), captured at the root of immutable snapshot v2. Legacy v1 reads STAFF_MANAGEMENT.limits.maxStaff with absent key meaning unlimited. STAFF_MANAGEMENT remains required independently. Staff count excludes OWNER. No password reset, invitation, owner transfer or custom role management."
security:
  -
    bearerAuth: []
paths:
  "/api/v1/restaurants/me":
    get:
      operationId: "getRestaurantProfile"
      description: "Requires RESTAURANT_PROFILE_VIEW and active tenant. No subscription required."
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RestaurantProfile"
        "400":
          description: "Validation or business rule error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "VALIDATION_ERROR"
                message: "Invalid request"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "401":
          description: "UNAUTHORIZED or ACCOUNT_INACTIVE"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "UNAUTHORIZED"
                message: "Authentication required"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "403":
          description: "Permission, tenant scope or entitlement denied"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "FORBIDDEN"
                message: "Access denied"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "404":
          description: "Resource not found; includes foreign-tenant staff"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "RESTAURANT_NOT_FOUND"
                message: "User not found"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "409":
          description: "Email, capacity or concurrent update conflict"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "CONCURRENT_STAFF_UPDATE"
                message: "Concurrent staff update"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
    patch:
      operationId: "updateRestaurantProfile"
      description: "Requires RESTAURANT_PROFILE_UPDATE. No subscription required. Normalized no-op creates no audit."
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/RestaurantProfile"
        "400":
          description: "Validation or business rule error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "VALIDATION_ERROR"
                message: "Invalid request"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "401":
          description: "UNAUTHORIZED or ACCOUNT_INACTIVE"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "UNAUTHORIZED"
                message: "Authentication required"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "403":
          description: "Permission, tenant scope or entitlement denied"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "FORBIDDEN"
                message: "Access denied"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "404":
          description: "Resource not found; includes foreign-tenant staff"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "RESTAURANT_NOT_FOUND"
                message: "User not found"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "409":
          description: "Email, capacity or concurrent update conflict"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "CONCURRENT_STAFF_UPDATE"
                message: "Concurrent staff update"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/UpdateRestaurantProfile"
            example:
              name: "Updated Restaurant"
              phone: ""
              timezone: "Asia/Ho_Chi_Minh"
              currencyCode: "VND"
  "/api/v1/staff":
    get:
      operationId: "searchStaff"
      description: "Requires tenant OWNER/MANAGER, matching permission and STAFF_MANAGEMENT feature. STAFF_VIEW. Includes protected OWNER. Stable id tiebreaker; wildcard characters treated literally."
