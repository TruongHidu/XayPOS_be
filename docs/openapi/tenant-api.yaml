                code: "FORBIDDEN"
                message: "Access denied"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "404":
          description: "Resource not found; includes foreign-tenant staff"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "USER_NOT_FOUND"
                message: "User not found"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "409":
          description: "Email, capacity or concurrent update conflict"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "CONCURRENT_STAFF_UPDATE"
                message: "Concurrent staff update"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
            maxLength: 100
        -
          name: "roleCode"
          in: "query"
          schema:
            type: "string"
            maxLength: 50
        -
          name: "active"
          in: "query"
          schema:
            type: "boolean"
        -
          name: "page"
          in: "query"
          schema:
            type: "integer"
            minimum: 0
            default: 0
        -
          name: "size"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "sortBy"
          in: "query"
          schema:
            type: "string"
            enum:
              - "createdAt"
              - "name"
              - "email"
              - "lastLoginAt"
            default: "createdAt"
        -
          name: "direction"
          in: "query"
          schema:
            type: "string"
            enum:
              - "asc"
              - "desc"
            default: "desc"
    post:
      operationId: "createStaff"
      description: "Requires tenant OWNER/MANAGER, matching permission and STAFF_MANAGEMENT feature. STAFF_CREATE. OWNER can assign MANAGER/WAITER/KITCHEN/CASHIER; MANAGER only operational roles. Global email uniqueness and snapshot maxStaff enforced."
      responses:
        "201":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Staff"
        "400":
          description: "Validation or business rule error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "VALIDATION_ERROR"
                message: "Invalid request"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "401":
          description: "UNAUTHORIZED or ACCOUNT_INACTIVE"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "UNAUTHORIZED"
                message: "Authentication required"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "403":
          description: "Permission, tenant scope or entitlement denied"
          content:
            "application/json":
              schema:
