        name: "staffId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    get:
      operationId: "getStaffPermissions"
      description: "Requires STAFF_PERMISSION_MANAGE and both STAFF_MANAGEMENT and STAFF_PERMISSION. OWNER manages staff; MANAGER only operational staff. No self/OWNER override access. Sorted active role/grant/deny/effective permission codes."
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StaffPermissions"
        "400":
          description: "Validation or business rule error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "VALIDATION_ERROR"
                message: "Invalid request"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "401":
          description: "UNAUTHORIZED or ACCOUNT_INACTIVE"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "UNAUTHORIZED"
                message: "Authentication required"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "403":
          description: "Permission, tenant scope or entitlement denied"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "FORBIDDEN"
                message: "Access denied"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "404":
          description: "Resource not found; includes foreign-tenant staff"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "USER_NOT_FOUND"
                message: "User not found"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "409":
          description: "Email, capacity or concurrent update conflict"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "CONCURRENT_STAFF_UPDATE"
                message: "Concurrent staff update"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
    put:
      operationId: "replaceStaffPermissions"
      description: "Requires STAFF_PERMISSION_MANAGE and both STAFF_MANAGEMENT and STAFF_PERMISSION. OWNER manages staff; MANAGER only operational staff. No self/OWNER override access. Real changes revoke refresh sessions; identical normalized assignments are no-ops."
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StaffPermissions"
        "400":
          description: "Validation or business rule error"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "VALIDATION_ERROR"
                message: "Invalid request"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "401":
          description: "UNAUTHORIZED or ACCOUNT_INACTIVE"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "UNAUTHORIZED"
                message: "Authentication required"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "403":
          description: "Permission, tenant scope or entitlement denied"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "FORBIDDEN"
                message: "Access denied"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "404":
          description: "Resource not found; includes foreign-tenant staff"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "USER_NOT_FOUND"
                message: "User not found"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "409":
          description: "Email, capacity or concurrent update conflict"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "CONCURRENT_STAFF_UPDATE"
                message: "Concurrent staff update"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ReplaceStaffPermissions"
            example:
              grants:
                - "ORDER_CANCEL"
              denies:
                - "TABLE_CLOSE"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    "MenuCreateGroup":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "maxLength": 100
          "minLength": 1
        "displayOrder":
          "type": "integer"
          "minimum": 0
          "default": 0
        "active":
          "type": "boolean"
          "default": true
      "required": ["name"]
    "MenuUpdateGroup":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "maxLength": 100
          "minLength": 1
          "nullable": true
        "displayOrder":
          "type": "integer"
          "minimum": 0
          "nullable": true
        "expectedVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
      "required": ["expectedVersion"]
    "MenuCreateItem":
      "type": "object"
      "additionalProperties": false
      "properties":
        "groupId":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "name":
          "type": "string"
          "maxLength": 150
          "minLength": 1
        "sku":
          "type": "string"
          "maxLength": 80
          "nullable": true
        "baseUnit":
          "type": "string"
          "maxLength": 30
          "minLength": 1
        "description":
          "type": "string"
          "maxLength": 10000
          "nullable": true
        "imageUrl":
          "type": "string"
          "maxLength": 500
          "description": "Absolute HTTP(S) URL without credentials; empty string clears the value."
          "nullable": true
        "salePrice":
          "type": "number"
          "minimum": 0
          "maximum": 999999999999.99
          "multipleOf": 0.01
        "active":
          "type": "boolean"
          "default": true
      "required": ["name","baseUnit","salePrice"]
    "MenuUpdateItem":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "maxLength": 150
          "minLength": 1
          "nullable": true
        "sku":
          "type": "string"
          "maxLength": 80
          "nullable": true
        "baseUnit":
          "type": "string"
          "maxLength": 30
          "minLength": 1
          "nullable": true
        "description":
          "type": "string"
          "maxLength": 10000
          "nullable": true
        "imageUrl":
          "type": "string"
          "maxLength": 500
          "description": "Absolute HTTP(S) URL without credentials; empty string clears the value."
          "nullable": true
        "salePrice":
          "type": "number"
          "minimum": 0
          "maximum": 999999999999.99
          "multipleOf": 0.01
          "nullable": true
        "expectedVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
      "required": ["expectedVersion"]
      "description": "Omitted/null fields remain unchanged. Empty sku/description/imageUrl clears the value. At least one editable non-null field is required."
    "MenuStatusRequest":
      "type": "object"
      "additionalProperties": false
      "properties":
        "active":
          "type": "boolean"
        "expectedVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
      "required": ["active","expectedVersion"]
    "MenuAvailabilityRequest":
      "type": "object"
      "additionalProperties": false
      "properties":
