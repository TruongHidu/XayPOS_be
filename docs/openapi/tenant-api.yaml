            updatedAt: "2026-09-22T00:00:00Z"
        page: 0
        size: 20
        totalElements: 1
        totalPages: 1
    StaffRoles:
      type: "array"
      items:
        "$ref": "#/components/schemas/StaffRole"
    CreateStaff:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          maxLength: 150
          minLength: 1
        email:
          type: "string"
          maxLength: 254
          format: "email"
        phone:
          type: "string"
          maxLength: 30
          nullable: true
        roleCode:
          type: "string"
          enum:
            - "MANAGER"
            - "WAITER"
            - "KITCHEN"
            - "CASHIER"
        initialPassword:
          type: "string"
          maxLength: 100
          minLength: 8
          writeOnly: true
          format: "password"
      required:
        - "name"
        - "email"
        - "roleCode"
        - "initialPassword"
    UpdateStaff:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          maxLength: 150
          minLength: 1
          nullable: true
        email:
          type: "string"
          maxLength: 254
          format: "email"
          minLength: 1
          nullable: true
        phone:
          type: "string"
          maxLength: 30
          nullable: true
        roleCode:
          type: "string"
          maxLength: 50
          minLength: 1
          nullable: true
      description: "Null/omitted fields are unchanged. Blank phone clears to null. At least one non-null field. Role change clears overrides and revokes refresh tokens; email change also revokes tokens."
    UpdateStaffStatus:
      type: "object"
      additionalProperties: false
      properties:
        active:
          type: "boolean"
        reason:
          type: "string"
          maxLength: 500
