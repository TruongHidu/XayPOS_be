    patch:
      tags: ["Ingredients"]
      operationId: "updateIngredient"
      description: "Requires INGREDIENT_UPDATE. expectedVersion is required. Omitted/null values stay unchanged; blank sku/description clears to null. Actual no-op creates no audit/version/timestamp change. RESERVED allocations prohibit baseUnit changes or disabling trackInventory with INGREDIENT_HAS_RESERVATIONS. Existing active recipe and nonzero stock guards remain. Name/SKU/cost edits do not alter existing reservation snapshots."
      parameters: [{"name":"ingredientId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/IngredientUpdate"}}}}
      responses:
        "200": {"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Ingredient"}}}}
        "400": {"description":"VALIDATION_ERROR, INVALID_REQUEST_BODY or EMPTY_UPDATE_REQUEST","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "401": {"description":"UNAUTHORIZED or ACCOUNT_INACTIVE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "403": {"description":"FORBIDDEN, TENANT_ACCESS_DENIED, SUBSCRIPTION_NOT_ACTIVE or FEATURE_NOT_ENTITLED","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "404": {"description":"INGREDIENT_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "409": {"description":"SKU_EXISTS, INGREDIENT_HAS_RESERVATIONS, INGREDIENT_HAS_STOCK, INGREDIENT_UNIT_IN_USE or CONCURRENT_INGREDIENT_UPDATE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
    delete:
      tags: ["Ingredients"]
      operationId: "deleteIngredient"
      description: "Requires INGREDIENT_DELETE. Soft delete; retry of an already deleted same-tenant ingredient returns 204 without duplicate audit. SKU remains reserved. RESERVED allocations return INGREDIENT_HAS_RESERVATIONS; nonzero stock and active recipe guards remain. Historical usages/reservations are preserved."
      parameters: [{"name":"ingredientId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"expectedVersion","in":"query","required":true,"schema":{"type":"integer","format":"int64","minimum":0}}]
      responses:
        "204": {"description":"Deleted or already deleted; no body"}
        "401": {"description":"UNAUTHORIZED or ACCOUNT_INACTIVE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "403": {"description":"FORBIDDEN, TENANT_ACCESS_DENIED, SUBSCRIPTION_NOT_ACTIVE or FEATURE_NOT_ENTITLED","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "404": {"description":"INGREDIENT_NOT_FOUND","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "409": {"description":"CONCURRENT_INGREDIENT_UPDATE, INVALID_INGREDIENT_TRANSITION, INGREDIENT_HAS_RESERVATIONS, INGREDIENT_HAS_STOCK or INGREDIENT_USED_BY_ACTIVE_RECIPE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
