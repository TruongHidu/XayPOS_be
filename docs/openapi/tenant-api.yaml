                message: "User not found"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
        "409":
          description: "Email, capacity or concurrent update conflict"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                success: false
                code: "CONCURRENT_STAFF_UPDATE"
                message: "Concurrent staff update"
                fieldErrors: {}
                timestamp: "2026-09-22T00:00:00Z"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateStaff"
            example:
              name: "Alice"
              email: "alice@example.com"
              roleCode: "WAITER"
              initialPassword: "ExamplePassword123!"
