      parameters: [{"name":"menuItemId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"expectedVersion","in":"query","required":true,"schema":{"type":"integer","format":"int64","minimum":0}}]
