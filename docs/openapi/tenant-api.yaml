          "type": "string"
          "enum": ["AVAILABLE","OUT_OF_STOCK"]
        "expectedVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
      "required": ["availabilityStatus","expectedVersion"]
    "MenuGroupAssignment":
      "type": "object"
      "additionalProperties": false
      "properties":
        "groupId":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "expectedVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
