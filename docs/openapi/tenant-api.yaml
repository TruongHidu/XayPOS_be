  "/api/v1/menu/items/{menuItemId}/recipes/{recipeId}/cost-estimate":
    get:
      tags: ["Recipes"]
      operationId: "estimateRecipeCost"
      summary: "Estimate one recipe version using current ingredient reference costs"
      description: >-
        Requires RECIPE_VIEW and RECIPE_MANAGEMENT, with tenant derived only from JWT.
        No inventory permission/feature, warehouse, stock, request body, expectedVersion
        or Idempotency-Key is required. Supports active and inactive recipe versions
        for a nondeleted same-tenant menu item, including inactive/out-of-stock menu items.
        Uses quantity/waste/yield/name/SKU/unit snapshots of the requested version,
        but CURRENT configured Item.costPrice per current baseUnit. Any costConfigured=false causes 409 INGREDIENT_COST_NOT_CONFIGURED; no partial/zero total is returned. Includes untracked, inactive
        and soft-deleted ingredients when their source is valid. A snapshot/current
        unit mismatch is a conflict; no unit conversion. This is not historical or
        FIFO/weighted-average cost. Gross quantity is exact; lineCost is HALF_UP to
        2 decimals; total is the sum of rounded lines; per-yield is HALF_UP to 2 decimals.
        Configured zero reference cost is valid and yields one warning per ingredient; missing
        cost is never silently treated as zero. Reads ingredient costs in one batch.
        estimatedAt comes from the injected Clock. No entity versions/timestamps,
        reference prices, recipes, balances, documents, reservations, ledger or
        mutation audits are written. Refresh after editing ingredient reference prices.
      parameters:
        - {"name":"menuItemId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
        - {"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      responses:
        "200":
          description: "Current reference cost estimate; an all-zero estimate is valid with warnings"
          headers:
            Cache-Control:
              description: "Do not store potentially sensitive or stale reference costs"
              schema: {"type":"string","enum":["no-store"]}
          content:
            application/json:
              schema: {"$ref":"#/components/schemas/RecipeCostEstimate"}
              example:
                menuItemId: "11111111-1111-4111-8111-111111111111"
                recipeId: "44444444-4444-4444-8444-444444444444"
                recipeVersion: 2
                recipeActive: true
                yieldQuantity: 10.000
                yieldUnit: "tô"
                currencyCode: "VND"
                costSource: "INGREDIENT_COST_PRICE"
                totalBatchCost: 369000.00
                costPerYieldUnit: 36900.00
                ingredients:
                  - ingredientId: "22222222-2222-4222-8222-222222222222"
                    sku: "NL-THIT-BO"
                    name: "Thịt bò"
                    unit: "g"
                    quantity: 1200.000
                    wastePercent: 5.00
                    grossQuantity: 1260.000
                    unitCost: 250.00
                    lineCost: 315000.00
                  - ingredientId: "33333333-3333-4333-8333-333333333333"
                    sku: "NL-BANH-PHO"
                    name: "Bánh phở"
                    unit: "g"
                    quantity: 1800.000
                    wastePercent: 0.00
                    grossQuantity: 1800.000
                    unitCost: 30.00
                    lineCost: 54000.00
                warnings: []
                estimatedAt: "2026-10-19T08:00:00Z"
        "400": {"description":"VALIDATION_ERROR or existing invalid UUID/path parameter error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "401": {"description":"UNAUTHORIZED or ACCOUNT_INACTIVE","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "403": {"description":"FORBIDDEN, TENANT_ACCESS_DENIED, SUBSCRIPTION_NOT_ACTIVE or FEATURE_NOT_ENTITLED","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "404": {"description":"MENU_ITEM_NOT_FOUND or RECIPE_NOT_FOUND; recipe from another tenant/menu item is hidden","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
        "409": {"description":"INGREDIENT_COST_NOT_CONFIGURED, INGREDIENT_COST_UNIT_MISMATCH, INGREDIENT_COST_UNAVAILABLE, INVALID_INGREDIENT_REFERENCE_COST or INVALID_RECIPE_COST_DATA; no partial estimate is returned","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}
  "/api/v1/menu/items/{menuItemId}/recipes/{activeRecipeId}/versions":
    post:
      tags: ["Recipes"]
      operationId: "createRecipeVersion"
      description: "Requires RECIPE_UPDATE and RECIPE_MANAGEMENT. Atomically deactivates the selected active recipe and creates the next immutable business version; request ordering of ingredients is ignored for equality."
      parameters: [{"name":"menuItemId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"activeRecipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
