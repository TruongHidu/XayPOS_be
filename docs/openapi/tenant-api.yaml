openapi: "3.0.3"
info:
  title: "POS SaaS Tenant Phase 1 API"
  version: "1.0.0"
  description: "Restaurant profile and staff administration. Tenant is derived from JWT. Disabled accounts are checked on protected bearer requests. Role/permission JWT claims may remain stale until access TTL expires (default 15 minutes); security changes revoke refresh tokens. maxStaff is a package-level positive integer or null (unlimited), captured at the root of immutable snapshot v2. Legacy v1 reads STAFF_MANAGEMENT.limits.maxStaff with absent key meaning unlimited. STAFF_MANAGEMENT remains required independently. Staff count excludes OWNER. No password reset, invitation, owner transfer or custom role management."
security:
  -
    bearerAuth: []
paths:
  "/api/v1/menu/groups":
    "get":
      "tags": ["Menu"]
      "operationId": "listMenuGroup"
      "description": "Requires MENU_VIEW. Tenant comes only from JWT. Requires active account/restaurant, active subscription and MENU_MANAGEMENT in its immutable snapshot. Permission comes from effective grants, not a fixed role."
      "parameters": [{"name":"q","in":"query","required":false,"schema":{"type":"string","maxLength":100,"description":"Literal case-insensitive search; % and _ are escaped."}},{"name":"active","in":"query","required":false,"schema":{"type":"boolean"}},{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":0,"default":0}},{"name":"size","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"sortBy","in":"query","required":false,"schema":{"type":"string","default":"createdAt","enum":["createdAt","name","displayOrder","updatedAt"]}},{"name":"direction","in":"query","required":false,"schema":{"type":"string","enum":["asc","desc"],"default":"desc"}}]
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MenuGroupPage"
        "400":
          "description": "VALIDATION_ERROR, INVALID_REQUEST_BODY or EMPTY_UPDATE_REQUEST"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Missing/invalid access token"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "403":
          "description": "Insufficient permission, unavailable tenant/account, SUBSCRIPTION_NOT_ACTIVE or FEATURE_NOT_ENTITLED"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "MENU_GROUP_NOT_FOUND or MENU_ITEM_NOT_FOUND; foreign tenant, wrong item type and deleted resources are hidden"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "MENU_GROUP_NAME_EXISTS, SKU_EXISTS, MENU_GROUP_INACTIVE, MENU_GROUP_NOT_EMPTY, INVALID_MENU_ITEM_TRANSITION or CONCURRENT_MENU_UPDATE"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
