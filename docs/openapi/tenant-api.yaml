      parameters: [{"name":"menuItemId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"recipeId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      responses:
        "200": {"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Recipe"}}}}
