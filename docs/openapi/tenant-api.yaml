          "minimum": 0
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
      "required": ["id","group","sku","name","baseUnit","description","imageUrl","salePrice","active","availabilityStatus","sellable","version","createdAt","updatedAt"]
    "MenuGroupPage":
