      additionalProperties: false
      properties:
        code:
          type: "string"
          maxLength: 100
        module:
          type: "string"
          maxLength: 50
        name:
          type: "string"
          maxLength: 150
        description:
          type: "string"
          nullable: true
      required:
        - "code"
        - "module"
        - "name"
    PermissionCatalog:
      type: "array"
      items:
        "$ref": "#/components/schemas/Permission"
      example:
        -
          code: "ORDER_CANCEL"
          module: "ORDER"
          name: "Cancel order"
          description: null
    StaffPermissions:
      type: "object"
      additionalProperties: false
      properties:
        staffId:
          type: "string"
          format: "uuid"
        roleCode:
          type: "string"
          maxLength: 50
        rolePermissions:
          type: "array"
          uniqueItems: true
          maxItems: 200
          items:
            type: "string"
            minLength: 1
            maxLength: 100
        grants:
          type: "array"
          uniqueItems: true
          maxItems: 200
          items:
            type: "string"
            minLength: 1
            maxLength: 100
        denies:
          type: "array"
          uniqueItems: true
          maxItems: 200
          items:
            type: "string"
            minLength: 1
            maxLength: 100
        effectivePermissions:
          type: "array"
          uniqueItems: true
          maxItems: 200
          items:
            type: "string"
            minLength: 1
            maxLength: 100
      example:
        staffId: "22222222-2222-4222-8222-222222222222"
        roleCode: "WAITER"
        rolePermissions:
          - "MENU_VIEW"
          - "TABLE_CLOSE"
        grants:
          - "ORDER_CANCEL"
        denies:
          - "TABLE_CLOSE"
        effectivePermissions:
          - "MENU_VIEW"
          - "ORDER_CANCEL"
    ReplaceStaffPermissions:
      type: "object"
      additionalProperties: false
      properties:
        grants:
          type: "array"
          uniqueItems: true
          maxItems: 200
          items:
            type: "string"
            minLength: 1
            maxLength: 100
        denies:
          type: "array"
          uniqueItems: true
          maxItems: 200
          items:
            type: "string"
            minLength: 1
            maxLength: 100
      required:
        - "grants"
        - "denies"
      description: "Atomic replacement; empty arrays clear all overrides. Codes are normalized uppercase. Overlap, inactive/unknown/system permissions, and grants outside actor DB effective permissions are rejected."
