openapi: 3.1.0
info:
  title: POS SaaS Public and Tenant Subscription API
  version: 1.1.0
  description: |
    Canonical contract for public package discovery and current-tenant subscription/entitlement
    reads. SUPER_ADMIN paths are intentionally excluded; their single canonical contract is
    `admin-api.yaml`.
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Public packages
  - name: Tenant subscriptions
  - name: Tenant entitlements
paths:
  /packages:
    get:
      tags: [Public packages]
      operationId: listPublicPackages
      summary: List active packages
      security: []
      responses:
        "200":
          description: Active packages ordered by price with active catalog features
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageResponse"

  /packages/{packageCode}:
    get:
      tags: [Public packages]
      operationId: getPublicPackage
      summary: Get an active package
      description: Package code is trimmed and normalized to uppercase. Inactive packages are hidden.
      security: []
      parameters:
        - $ref: "#/components/parameters/PackageCode"
      responses:
        "200":
          description: Active package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResponse"
        "404":
          $ref: "#/components/responses/PackageNotFound"

  /subscriptions/current:
    get:
      tags: [Tenant subscriptions]
      operationId: getCurrentTenantSubscription
      summary: Get the current tenant's effective subscription
      description: |
        Requires `SUBSCRIPTION_VIEW`. The tenant ID is read from the authenticated principal,
        never from a request parameter. Effective means `ACTIVE && startAt <= now && now < endAt`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Effective subscription and immutable entitlement snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEntitlementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"

  /subscriptions/history:
    get:
      tags: [Tenant subscriptions]
      operationId: getTenantSubscriptionHistory
      summary: Get the current tenant's subscription history
      description: |
        Requires `SUBSCRIPTION_VIEW`. Results are ordered by `createdAt DESC`. The implementation
        normalizes a negative page to 0, size below 1 to 1 and size above 100 to 100.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, default: 0}
        - name: size
          in: query
          schema: {type: integer, default: 20}
      responses:
        "200":
          description: Paginated subscription history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"

  /me/entitlements:
    get:
      tags: [Tenant entitlements]
      operationId: getMyEntitlements
      summary: Get the authenticated tenant's current entitlements
      description: The tenant ID comes from the authenticated principal and current effective snapshot.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Effective subscription and feature grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentEntitlementResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TenantForbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PackageCode:
      name: packageCode
      in: path
      required: true
      schema: {type: string, example: PRO}
  responses:
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: UNAUTHORIZED
            message: Authentication is required
            fieldErrors: {}
            timestamp: "2026-08-27T00:00:00Z"
    TenantForbidden:
      description: Missing permission, inactive restaurant or no effective subscription
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            permission:
              value: {success: false, code: FORBIDDEN, message: Access denied, fieldErrors: {}, timestamp: "2026-08-27T00:00:00Z"}
            restaurant:
              value: {success: false, code: RESTAURANT_INACTIVE, message: Restaurant is not active, fieldErrors: {}, timestamp: "2026-08-27T00:00:00Z"}
            subscription:
              value: {success: false, code: SUBSCRIPTION_NOT_ACTIVE, message: No active subscription is available, fieldErrors: {}, timestamp: "2026-08-27T00:00:00Z"}
    PackageNotFound:
      description: Active package was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: PACKAGE_NOT_FOUND
            message: Package not found
            fieldErrors: {}
            timestamp: "2026-08-27T00:00:00Z"
    ValidationError:
      description: Invalid query type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            code: VALIDATION_ERROR
            message: Request validation failed
            fieldErrors: {}
            timestamp: "2026-08-27T00:00:00Z"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [success, code, message, fieldErrors, timestamp]
      properties:
        success: {type: boolean, const: false}
        code: {type: string}
        message: {type: string}
        fieldErrors:
          type: object
          additionalProperties: {type: string}
        timestamp: {type: string, format: date-time}
    SubscriptionStatus:
      type: string
      enum: [PENDING, ACTIVE, EXPIRED, CANCELLED]
    FeatureEntitlementResponse:
      type: object
      additionalProperties: false
      required: [code, limits]
      properties:
        code: {type: string, example: TABLE_MANAGEMENT}
        limits:
          type: object
          additionalProperties: true
    PackageResponse:
      type: object
      additionalProperties: false
      required: [id, code, name, description, priceAmount, currencyCode, billingCycleMonths, features]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: PRO}
        name: {type: string, example: Pro}
        description: {type: [string, "null"]}
        priceAmount: {type: number, minimum: 0, example: 399000.00}
        currencyCode: {type: string, example: VND}
        billingCycleMonths: {type: integer, minimum: 1, example: 1}
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureEntitlementResponse"
    SubscriptionResponse:
      type: object
      additionalProperties: false
      required: [id, restaurantId, packageId, packageCode, status, startAt, endAt, autoRenew, priceAmount, currencyCode, activatedAt, cancelledAt, features]
      properties:
        id: {type: string, format: uuid}
        restaurantId: {type: string, format: uuid}
        packageId: {type: string, format: uuid}
        packageCode: {type: [string, "null"]}
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        autoRenew: {type: boolean}
        priceAmount: {type: number, minimum: 0}
        currencyCode: {type: string}
        activatedAt: {type: [string, "null"], format: date-time}
        cancelledAt: {type: [string, "null"], format: date-time}
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureEntitlementResponse"
    CurrentEntitlementResponse:
      type: object
      additionalProperties: false
      required: [subscriptionId, packageCode, status, startAt, endAt, features]
      properties:
        subscriptionId: {type: string, format: uuid}
        packageCode: {type: string}
        status: {type: string, const: ACTIVE}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        features:
          type: array
          description: Immutable feature snapshot captured at activation.
          items:
            $ref: "#/components/schemas/FeatureEntitlementResponse"
    SubscriptionPageResponse:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionResponse"
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
