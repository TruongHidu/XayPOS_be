"openapi": "3.0.3"
"info":
  "title": "POS SaaS Staff Order MVP"
  "version": "1.7.0"
  "description": "Staff ORDER with serviceType Strategy and create/append/update-item CoR. POST /orders accepts tableId+SUBMIT to open seating and confirm atomically, or legacy tableSessionId. V19 enforces one serving DINE_IN order per session. Legacy hashes retained; table intent has its own fingerprint. Manual payment is documented separately in payment-api.yaml. KDS/single-item and bulk mark-ready/mark-served/complete/close operations are documented in kitchen-lifecycle-api.yaml. V23 grants KITCHEN_MARK_READY and ORDER_MARK_SERVED to system CASHIER/KITCHEN without bypassing snapshot features or user DENY; bulk body uses expectedOrderVersion. V24 complete DINE_IN atomically closes exactly order.tableSessionId after full payment, all live items SERVED and session readiness, with ORDER_COMPLETE+TABLE_CLOSE and ORDER_MANAGEMENT+TABLE_MANAGEMENT. TAKEAWAY requires only ORDER_COMPLETE+ORDER_MANAGEMENT and no TABLE operation. Complete body remains expectedVersion of ORDER and response remains OrderResponse; CLOSED retries are no-ops, legacy COMPLETED+OPEN repairs close only the session if ready. V24 grants TABLE_CLOSE to global system CASHIER/MANAGER, including manual close/cancel according to existing policies; refresh/login required. V25 QR ordering uses separate guest pending-request and staff-approval APIs in public-qr-order-api.yaml. Staff hashes, DTOs and POS_QUICK_ORDER gate remain unchanged. V33 reserves tracked immutable snapshot usages during SUBMIT/confirm/append/QR approve; DRAFT and QR pending never reserve. Missing default warehouse or insufficient available stock returns 409 INVENTORY_DEFAULT_WAREHOUSE_REQUIRED/INSUFFICIENT_AVAILABLE_STOCK and rolls back the whole command. PENDING starts consume once; cancel PENDING releases without increasing physical. Durable SKIPPED never applies inventory later. Existing staff permissions suffice without inventory/recipe management permissions. Payment/complete do not deduct; table transfer preserves allocation warehouse. Allocation details remain separate in tenant-api.yaml and never enter ordinary OrderResponse. No /orders/from-table route; occupancy stays in TABLE."
"security":
  -
    "BearerAuth": []
"paths":
  "/api/v1/orders":
    "get":
      "operationId": "searchOrders"
      "description": "Server pagination, no collection fetch-join/N+1. Stable id ASC tie-breaker. Requires JWT tenant context, ORDER_VIEW and ORDER_MANAGEMENT snapshot grant."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_VIEW"
      "parameters":
        -
          "name": "status"
          "in": "query"
          "schema":
            "$ref": "#/components/schemas/OrderStatus"
        -
          "name": "serviceType"
          "in": "query"
          "schema":
            "$ref": "#/components/schemas/ServiceType"
        -
          "name": "tableSessionId"
          "in": "query"
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "q"
          "in": "query"
          "description": "Trimmed case-insensitive orderCode search. Percent/underscore/backslash literal."
          "schema":
            "type": "string"
            "maxLength": 100
        -
          "name": "page"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 0
            "default": 0
        -
          "name": "size"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
        -
          "name": "sortBy"
          "in": "query"
          "schema":
            "type": "string"
            "enum":
              - "createdAt"
              - "updatedAt"
              - "orderCode"
              - "totalAmount"
            "default": "createdAt"
        -
          "name": "direction"
          "in": "query"
          "schema":
            "type": "string"
            "pattern": "^[aA][sS][cC]$|^[dD][eE][sS][cC]$"
            "default": "desc"
      "responses":
        "200":
          "description": "Page of summaries; empty result is content=[] and totalElements/totalPages=0."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/OrderPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
    "post":
      "operationId": "createOrder"
      "description": "DRAFT default (absent/null) creates OPEN with ORDER_CREATE. SUBMIT requires ORDER_CREATE plus ORDER_UPDATE and creates CONFIRMED atomically; PENDING lines receive sentToKitchenAt without automatically changing kitchen status. DINE_IN takes exactly one of tableSessionId (must already be OPEN; DRAFT/SUBMIT supported) or tableId (explicit SUBMIT only). tableId reuses OPEN seating or opens a new session only at persistence; opening also requires runtime TABLE_OPEN. Existing seating and replay do not require TABLE_OPEN. TABLE_MANAGEMENT required for DINE_IN; TAKEAWAY requires neither seating reference and POS_QUICK_ORDER. ORDER_MANAGEMENT always required. Auth/features/tenant lock and static shape checks before replay; live seating/menu checks after replay. Legacy DRAFT and create-submit-v1 hashes preserved when tableId absent/null; create-table-submit-v1 hashes original client tableId, never resolved session or live values. Same key/hash/actor returns original order's current resource; changed actor/payload/table/mode conflicts. Serving order blocks new create with 409, never auto-append. Any later write/confirmation/audit failure rolls back new session and order together."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_CREATE"
      "parameters":
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "description": "Stable, nonblank key scoped to tenant/create. Reuse the same key/payload for retry."
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 100
      "responses":
        "200":
          "description": "Resource replay: same orderId, current representation, no new audit/history/version. Idempotency-Replayed=true."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
            "Idempotency-Replayed":
              "description": "CORS exposed replay indicator."
              "schema":
                "type": "boolean"
                "example": true
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "201":
          "description": "New OPEN (DRAFT) or CONFIRMED (SUBMIT) order, UNPAID/paidAmount=0. Idempotency-Replayed=false. Use returned version."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
            "Idempotency-Replayed":
              "description": "CORS exposed replay indicator."
              "schema":
                "type": "boolean"
                "example": false
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateOrder"
            "examples":
              "submitFromTable":
                "summary": "Create seating only when the staff sends the order"
                "value":
                  "serviceType": "DINE_IN"
                  "sourceChannel": "WAITER"
                  "tableId": "11111111-1111-4111-8111-111111111111"
                  "submissionMode": "SUBMIT"
                  "guestCount": 2
                  "items": [{ "itemId": "22222222-2222-4222-8222-222222222222", "quantity": 1 }]
              "legacySessionDraft":
                "value":
                  "serviceType": "DINE_IN"
                  "sourceChannel": "WAITER"
                  "tableSessionId": "33333333-3333-4333-8333-333333333333"
                  "items": [{ "itemId": "22222222-2222-4222-8222-222222222222", "quantity": 1 }]
              "takeawaySubmit":
                "value":
                  "serviceType": "TAKEAWAY"
                  "sourceChannel": "CASHIER"
                  "submissionMode": "SUBMIT"
                  "items": [{ "itemId": "22222222-2222-4222-8222-222222222222", "quantity": 1 }]
  "/api/v1/orders/{orderId}":
    "get":
      "operationId": "getOrder"
      "description": "Snapshot-based detail including cancelled lines. Requires JWT tenant context, ORDER_VIEW and ORDER_MANAGEMENT snapshot grant."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_VIEW"
      "parameters":
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Current OrderResponse; use returned aggregate version."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
    "patch":
      "operationId": "updateOrder"
      "description": "OPEN/UNPAID only. Absent/null fields unchanged; blank optional text clears. Source/type/session/currency/amounts immutable. No-op does not advance version/audit. Requires JWT tenant context, ORDER_UPDATE and ORDER_MANAGEMENT snapshot grant."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_UPDATE"
      "parameters":
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Current OrderResponse; use returned aggregate version."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UpdateOrder"
  "/api/v1/orders/{orderId}/items":
    "post":
      "operationId": "addOrderItems"
      "description": "DRAFT default accepts OPEN only, preserves legacy version-only retry semantics. SUBMIT accepts OPEN/CONFIRMED with UNPAID/zero paid; requires Idempotency-Key, plus TABLE_MANAGEMENT or POS_QUICK_ORDER by type. DINE_IN seating must still be OPEN/active. OPEN+SUBMIT rechecks all live items then confirms atomically. CONFIRMED preserves confirmedAt, does not audit another confirmation. Fresh independent lines/current snapshots; old lines unchanged, no merge/reprice. Requires ORDER_UPDATE and ORDER_MANAGEMENT. Replay checks actor/target/normalized ordered payload including original expectedVersion before mutable checks and returns current resource. Never auto-select or merge orders in session."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_UPDATE"
      "parameters":
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": false
          "description": "Required for SUBMIT, ignored for legacy DRAFT. Stable key for one addition; freeze target/body/expectedVersion on retry. Independent tenant-scoped append namespace."
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 100
      "responses":
        "200":
          "description": "New addition or resource replay, current OrderResponse. Use returned aggregate version; Idempotency-Replayed indicates replay."
          "headers":
            "Idempotency-Replayed":
              "description": "True only for a matching successful SUBMIT append replay; false for a new addition/DRAFT."
              "schema":
                "type": "boolean"
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AddItems"
  "/api/v1/orders/{orderId}/items/{orderItemId}":
    "patch":
      "operationId": "updateOrderItem"
      "description": "PENDING line of OPEN order only. Preserve unitPrice snapshot; child-only change advances root version even if Clock/total unchanged. Requires JWT tenant context, ORDER_UPDATE and ORDER_MANAGEMENT snapshot grant."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_UPDATE"
      "parameters":
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "orderItemId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Current OrderResponse; use returned aggregate version."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UpdateItem"
  "/api/v1/orders/{orderId}/items/{orderItemId}/cancel":
    "post":
      "operationId": "cancelOrderItem"
      "description": "Application policy enforces the state-specific permission. Cancel PENDING only, preserve gross snapshot and exclude cancelled amount. Last live line cancellation cancels root. Terminal retry is no-op before stale-version check, after authorization. Requires JWT tenant context, ORDER_UPDATE (draft) or ORDER_CANCEL (confirmed) and ORDER_MANAGEMENT snapshot grant."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_UPDATE (draft) or ORDER_CANCEL (confirmed)"
      "parameters":
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "orderItemId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Current OrderResponse; use returned aggregate version."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CancelRequest"
  "/api/v1/orders/{orderId}/confirm":
    "post":
      "operationId": "confirmOrder"
      "description": "Legacy OPEN -> CONFIRMED; recheck all live sellability without repricing. Already CONFIRMED is idempotent before stale-version check. sentToKitchenAt is set once when submitted, with legacy NULL rows still visible in KDS. Calling more uses append SUBMIT with an explicit existing orderId; old metadata/line edits remain OPEN only. Requires JWT tenant context, ORDER_UPDATE and ORDER_MANAGEMENT snapshot grant."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_UPDATE"
      "parameters":
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Current OrderResponse; use returned aggregate version."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/VersionRequest"
  "/api/v1/orders/{orderId}/cancel":
    "post":
      "operationId": "cancelOrder"
      "description": "Cancel OPEN/CONFIRMED with no cooking/fulfilled items or financial obligations. Cancelled replay is idempotent before version check. Snapshot/history kept; no refund or session closure. Requires JWT tenant context, ORDER_CANCEL and ORDER_MANAGEMENT snapshot grant."
      "security":
        -
          "BearerAuth": []
      "x-permission": "ORDER_CANCEL"
      "parameters":
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Current OrderResponse; use returned aggregate version."
          "headers":
            "Cache-Control":
              "description": "Responses are not cached."
              "schema":
                "type": "string"
                "example": "no-store"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Order"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "500":
          "$ref": "#/components/responses/Internal"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CancelRequest"
  "/api/v1/table-sessions/{sessionId}/active-order":
    "get":
      "operationId": "getActiveSessionOrder"
      "description": "Requires ORDER_VIEW and ORDER_MANAGEMENT snapshot grant. Tenant-scoped session ownership via TABLE port; read access does not require live OPEN seating. 200 current snapshot-based serving OrderResponse, or 204 without body. Serving statuses OPEN/CONFIRMED/PREPARING/READY/SERVED; independent of paymentStatus. Never select latest/first when data inconsistent; 409 INCONSISTENT_SERVING_ORDER_STATE. No audit/history writes."
      "security":
        - "BearerAuth": []
      "x-permission": "ORDER_VIEW"
      "parameters":
        - "name": "sessionId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "responses":
        "200":
          "description": "Exactly one serving order, current representation."
          "headers":
            "Cache-Control":
              "schema": { "type": "string", "example": "no-store" }
          "content":
            "application/json":
              "schema": { "$ref": "#/components/schemas/Order" }
        "204":
          "description": "Owned session has no serving order; no response body."
          "headers":
            "Cache-Control":
              "schema": { "type": "string", "example": "no-store" }
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "500": { "$ref": "#/components/responses/Internal" }
  "/api/v1/orders/{orderId}/items/{orderItemId}/recipe-snapshot":
    "get":
      "operationId": "getOrderItemRecipeSnapshot"
      "description": "Requires ORDER_VIEW plus RECIPE_VIEW, ORDER_MANAGEMENT plus RECIPE_MANAGEMENT and the normal tenant/account/restaurant/subscription guards. Reads immutable recipe acceptance data only; no live recipe/ingredient/cost lookup or mutation. Cross-tenant or wrong-order lines return 404. CAPTURED includes all recipe ingredients, including trackInventory=false; quantities use final CEILING scale 3, waste=quantity*(1+waste/100). V37: recipeEnabled=false freezes RECIPE_DISABLED/MANUAL with no usages; allocation is SKIPPED/SNAPSHOT_RECIPE_DISABLED. Enabled plus valid recipe freezes CAPTURED/RECIPE; enabled without recipe entitlement freezes FEATURE_DISABLED/RECIPE without manual fallback. Enabled with entitlement but missing active recipe rejects acceptance with 409 ACTIVE_RECIPE_REQUIRED. Current toggle changes never alter existing decision/reservation/consume/release. NO_RECIPE and FEATURE_DISABLED decisions are durable; LEGACY_UNAVAILABLE means pre-V32 submitted lines with no guessed recipe and null capturedAt. NOT_SUBMITTED is response-only for unsent lines. Submitted missing/drifted snapshots return ORDER_ITEM_RECIPE_SNAPSHOT_CONFLICT. Does not reserve or deduct inventory, compute actual historical cost or expose private recipe data in regular ORDER/KDS/public QR responses."
      "security": [{"BearerAuth": []}]
      "x-permission": "ORDER_VIEW and RECIPE_VIEW"
      "parameters":
        - {"name": "orderId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
        - {"name": "orderItemId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      "responses":
        "200":
          "description": "Immutable snapshot or NOT_SUBMITTED; no body is sent in the request."
          "headers": {"Cache-Control": {"schema": {"type": "string", "example": "no-store"}}}
          "content":
            "application/json":
              "schema": {"$ref": "#/components/schemas/OrderRecipeSnapshot"}
              "example":
                "orderId": "11111111-1111-4111-8111-111111111111"
                "orderItemId": "22222222-2222-4222-8222-222222222222"
                "snapshotStatus": "CAPTURED"
                "recipeId": "33333333-3333-4333-8333-333333333333"
                "recipeVersion": 2
                "yieldQuantity": 10.000
                "yieldUnit": "phần"
                "orderQuantity": 3.000
                "orderUnit": "phần"
                "capturedAt": "2026-10-20T08:00:00Z"
                "ingredients": [{"ingredientId": "44444444-4444-4444-8444-444444444444", "sku": "BEEF", "name": "Thịt bò", "unit": "g", "recipeQuantity": 1000.000, "wastePercent": 5.00, "trackInventory": true, "requiredQuantity": 315.000}]
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "500": {"$ref": "#/components/responses/Internal"}
  "/api/v1/orders/{orderId}/items/{orderItemId}/cost-snapshot":
    "get":
      "operationId": "getOrderItemCostSnapshot"
      "summary": "Read immutable historical reference-cost summary for one order line"
      "description": >-
        Requires ORDER_VIEW and REPORT_DETAIL_VIEW, ORDER_MANAGEMENT and DETAIL_REPORT,
        with existing tenant/account/restaurant/subscription guards. No recipe/inventory
        permission or feature is required for this summary. Reads immutable accepted
        header facts only; no ingredient/recipe details, live catalogue lookup, audit or
        version mutation. Fresh SUBMIT/confirm/append/QR approval captures version 1 in
        the same acceptance transaction. COMPLETE includes configured zero; INCOMPLETE
        and UNAVAILABLE have null totals. LEGACY_UNAVAILABLE has null monetary version,
        basis, amounts and capture time, retaining only source metadata actually stored.
        NOT_SUBMITTED has null source/monetary metadata and writes no row. Submitted lines
        with missing/drifted headers return ORDER_ITEM_RECIPE_SNAPSHOT_CONFLICT; invalid
        stored monetary version/status returns ORDER_COST_SNAPSHOT_CONFLICT. Cross-tenant
        or wrong-order lines return 404. RECIPE totalCost is authoritative: sum of each
        HALF_UP 2-decimal requiredQuantity * frozen ingredient price, including untracked
        usages; unitCost is total/orderQuantity HALF_UP 2, never multiplied back to replace
        total. This is catalogue reference cost at acceptance, not guaranteed actual COGS,
        FIFO, net profit or evidence of inventory consumption. Existing recipe-snapshot,
        OrderResponse, KDS/public QR/menu and ORDER_CHANGED retain their current fields
        and permissions. No new realtime event or package/role/feature grants.
      "security": [{"BearerAuth": []}]
      "x-permission": "ORDER_VIEW and REPORT_DETAIL_VIEW"
      "x-features": ["ORDER_MANAGEMENT", "DETAIL_REPORT"]
      "parameters":
        - {"name": "orderId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
        - {"name": "orderItemId", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}
      "responses":
        "200":
          "description": "Immutable summary, LEGACY_UNAVAILABLE or NOT_SUBMITTED; nullable values are never implicit zero."
          "headers": {"Cache-Control": {"schema": {"type": "string", "example": "no-store"}}}
          "content":
            "application/json":
              "schema": {"$ref": "#/components/schemas/OrderCostSnapshot"}
              "example":
                "orderId": "11111111-1111-4111-8111-111111111111"
                "orderItemId": "22222222-2222-4222-8222-222222222222"
                "costSnapshotVersion": 1
                "costBasis": "CATALOG_REFERENCE_AT_ACCEPTANCE"
                "costSource": "RECIPE"
                "costStatus": "COMPLETE"
                "reason": null
                "orderQuantity": 2.000
                "orderUnit": "portion"
                "currencyCode": "VND"
                "unitCost": 25000.00
                "totalCost": 50000.00
                "costCapturedAt": "2026-10-27T08:00:00Z"
        "400": {"$ref": "#/components/responses/BadRequest"}
        "401": {"$ref": "#/components/responses/Unauthorized"}
        "403": {"$ref": "#/components/responses/Forbidden"}
        "404": {"$ref": "#/components/responses/NotFound"}
        "409": {"$ref": "#/components/responses/Conflict"}
        "500": {"$ref": "#/components/responses/Internal"}
"components":
  "securitySchemes":
    "BearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
  "responses":
    "BadRequest":
      "description": "VALIDATION_ERROR / INVALID_REQUEST_BODY / EMPTY_UPDATE_REQUEST / INVALID_IDEMPOTENCY_KEY / DINE_IN_SESSION_REQUIRED / AMBIGUOUS_ORDER_SEATING / TABLE_ORDER_REQUIRES_SUBMIT / TAKEAWAY_SESSION_NOT_ALLOWED / TAKEAWAY_TABLE_NOT_ALLOWED / serving-context or precision error."
      "headers":
        "Cache-Control":
          "description": "Responses are not cached."
          "schema":
            "type": "string"
            "example": "no-store"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
    "Unauthorized":
      "description": "UNAUTHORIZED or ACCOUNT_INACTIVE."
      "headers":
        "Cache-Control":
          "description": "Responses are not cached."
          "schema":
            "type": "string"
            "example": "no-store"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
    "Forbidden":
      "description": "FORBIDDEN / TENANT_ACCESS_DENIED / RESTAURANT_INACTIVE / SUBSCRIPTION_NOT_ACTIVE / FEATURE_NOT_ENTITLED."
      "headers":
        "Cache-Control":
          "description": "Responses are not cached."
          "schema":
            "type": "string"
            "example": "no-store"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
    "NotFound":
      "description": "Tenant-scoped order, item, menu or table/session resource not found."
      "headers":
        "Cache-Control":
          "description": "Responses are not cached."
          "schema":
            "type": "string"
            "example": "no-store"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
    "Conflict":
      "description": "CONCURRENT_ORDER_UPDATE / IDEMPOTENCY_KEY_REUSED / ORDER_CODE_CONFLICT / TABLE_SESSION_HAS_SERVING_ORDER / TABLE_ALREADY_OCCUPIED / INCONSISTENT_TABLE_SESSION_STATE / lifecycle, availability, currency or financial conflict."
      "headers":
        "Cache-Control":
          "description": "Responses are not cached."
          "schema":
            "type": "string"
            "example": "no-store"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
    "Internal":
      "description": "INTERNAL_ERROR; no SQL or exception details."
      "headers":
        "Cache-Control":
          "description": "Responses are not cached."
          "schema":
            "type": "string"
            "example": "no-store"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
  "schemas":
    "OrderCostSnapshot":
      "type": "object"
      "additionalProperties": false
      "required": ["orderId", "orderItemId", "costSnapshotVersion", "costBasis", "costSource", "costStatus", "reason", "orderQuantity", "orderUnit", "currencyCode", "unitCost", "totalCost", "costCapturedAt"]
      "properties":
        "orderId": {"type": "string", "format": "uuid"}
        "orderItemId": {"type": "string", "format": "uuid"}
        "costSnapshotVersion": {"type": "integer", "nullable": true, "enum": [1, null], "description": "Version 1 for fresh monetary decisions; null for legacy or not submitted."}
        "costBasis": {"type": "string", "nullable": true, "enum": ["CATALOG_REFERENCE_AT_ACCEPTANCE", null], "description": "Null for legacy/not submitted; reference cost is not actual inventory valuation."}
        "costSource": {"type": "string", "nullable": true, "enum": ["MANUAL", "RECIPE", null], "description": "Frozen source only; legacy retains stored source if any, never inferred from current toggle. Null for NOT_SUBMITTED."}
        "costStatus": {"type": "string", "enum": ["COMPLETE", "INCOMPLETE", "UNAVAILABLE", "LEGACY_UNAVAILABLE", "NOT_SUBMITTED"], "description": "LEGACY_UNAVAILABLE and NOT_SUBMITTED are response-only. CAPTURED recipe status does not imply COMPLETE cost."}
        "reason": {"type": "string", "nullable": true, "enum": ["MANUAL_COST_NOT_CONFIGURED", "INGREDIENT_COST_NOT_CONFIGURED", "RECIPE_FEATURE_DISABLED", null], "description": "INCOMPLETE uses its matching manual/ingredient reason; UNAVAILABLE uses recipe feature reason. Null for COMPLETE/legacy/not submitted."}
        "orderQuantity": {"type": "number", "exclusiveMinimum": true, "minimum": 0, "multipleOf": 0.001}
        "orderUnit": {"type": "string"}
        "currencyCode": {"type": "string", "description": "Immutable ORDER currency; no conversion or aggregation across currencies."}
        "unitCost": {"type": "number", "nullable": true, "minimum": 0, "multipleOf": 0.01, "description": "NUMERIC(38,2), COMPLETE only. Recipe presentation unit is total/orderQuantity HALF_UP 2; configured zero is valid."}
        "totalCost": {"type": "number", "nullable": true, "minimum": 0, "multipleOf": 0.01, "description": "NUMERIC(38,2), COMPLETE only. Recipe authoritative sum of individually rounded tracked and untracked usage costs. Never treat null as zero or recalculate from rounded unitCost."}
        "costCapturedAt": {"type": "string", "format": "date-time", "nullable": true, "description": "Acceptance timestamp for version 1, including INCOMPLETE/UNAVAILABLE; null for legacy/not submitted. Not a consumption timestamp."}
    "OrderSubmissionMode":
      "type": "string"
      "nullable": true
      "default": "DRAFT"
      "enum":
        - "DRAFT"
        - "SUBMIT"
      "description": "Command intent, not a status. Absent/null means legacy DRAFT."
    "OrderRecipeSnapshot":
      "type": "object"
      "additionalProperties": false
      "required": ["orderId", "orderItemId", "snapshotStatus", "recipeId", "recipeVersion", "yieldQuantity", "yieldUnit", "orderQuantity", "orderUnit", "capturedAt", "ingredients", "recipeEnabledSnapshot", "costSourceSnapshot"]
      "properties":
        "orderId": {"type": "string", "format": "uuid"}
        "orderItemId": {"type": "string", "format": "uuid"}
        "recipeEnabledSnapshot": {"type":"boolean","nullable":true,"description":"Frozen at acceptance. Null for old or not-submitted decisions; never inferred from current menu."}
        "costSourceSnapshot": {"type":"string","nullable":true,"enum":["MANUAL","RECIPE"],"description":"Selected source only, not a monetary cost snapshot or completeness guarantee."}
        "snapshotStatus": {"type": "string", "enum": ["CAPTURED", "RECIPE_DISABLED", "NO_RECIPE", "FEATURE_DISABLED", "LEGACY_UNAVAILABLE", "NOT_SUBMITTED"]}
        "recipeId": {"type": "string", "format": "uuid", "nullable": true}
        "recipeVersion": {"type": "integer", "minimum": 1, "nullable": true, "description": "Immutable recipe business version, not lock_version."}
        "yieldQuantity": {"type": "number", "exclusiveMinimum": true, "minimum": 0, "multipleOf": 0.001, "nullable": true}
        "yieldUnit": {"type": "string", "nullable": true}
        "orderQuantity": {"type": "number", "exclusiveMinimum": true, "minimum": 0, "multipleOf": 0.001}
        "orderUnit": {"type": "string"}
        "capturedAt": {"type": "string", "format": "date-time", "nullable": true}
        "ingredients": {"type": "array", "items": {"$ref": "#/components/schemas/OrderRecipeUsage"}}
    "OrderRecipeUsage":
      "type": "object"
      "additionalProperties": false
      "required": ["ingredientId", "sku", "name", "unit", "recipeQuantity", "wastePercent", "trackInventory", "requiredQuantity"]
      "properties":
        "ingredientId": {"type": "string", "format": "uuid"}
        "sku": {"type": "string", "nullable": true}
        "name": {"type": "string"}
        "unit": {"type": "string"}
        "recipeQuantity": {"type": "number", "minimum": 0, "exclusiveMinimum": true, "multipleOf": 0.001}
        "wastePercent": {"type": "number", "minimum": 0, "maximum": 100, "multipleOf": 0.01}
        "trackInventory": {"type": "boolean"}
        "requiredQuantity": {"type": "number", "minimum": 0, "exclusiveMinimum": true, "maximum": 99999999999.999, "multipleOf": 0.001}
    "OrderStatus":
      "type": "string"
      "enum":
        - "OPEN"
        - "CONFIRMED"
        - "PREPARING"
        - "READY"
        - "SERVED"
        - "COMPLETED"
        - "CANCELLED"
    "OrderItemStatus":
      "type": "string"
      "enum":
        - "PENDING"
        - "COOKING"
        - "READY"
        - "SERVED"
        - "CANCELLED"
    "PaymentStatus":
      "type": "string"
      "enum":
        - "UNPAID"
        - "PARTIALLY_PAID"
        - "PAID"
        - "PARTIALLY_REFUNDED"
        - "REFUNDED"
    "ServiceType":
      "type": "string"
      "enum":
        - "DINE_IN"
        - "TAKEAWAY"
    "SourceChannel":
      "type": "string"
      "enum":
        - "CASHIER"
        - "WAITER"
        - "QR_STATIC"
        - "QR_TABLE"
    "CreateLine":
      "type": "object"
      "additionalProperties": false
      "required":
        - "itemId"
        - "quantity"
      "properties":
        "itemId":
          "type": "string"
          "format": "uuid"
        "quantity":
          "type": "number"
          "exclusiveMinimum": true
          "minimum": 0
          "maximum": 999999999.999
          "multipleOf": 0.001
        "note":
          "type": "string"
          "maxLength": 2000
          "nullable": true
    "CreateOrder":
      "type": "object"
      "additionalProperties": false
      "description": "Three exclusive seating shapes. tableId is client intent only; response returns resolved tableSessionId. No expectedVersion required for the new tableId creation command: current table eligibility is checked under restaurant lock. Manual-open API retains its existing table version check."
      "required":
        - "serviceType"
        - "sourceChannel"
        - "items"
      "properties":
        "submissionMode":
          "$ref": "#/components/schemas/OrderSubmissionMode"
        "serviceType":
          "$ref": "#/components/schemas/ServiceType"
        "sourceChannel":
          "type": "string"
          "enum":
            - "CASHIER"
            - "WAITER"
        "tableSessionId":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "tableId":
          "type": "string"
          "format": "uuid"
          "nullable": true
          "description": "DINE_IN SUBMIT only, mutually exclusive with tableSessionId."
        "guestCount":
          "type": "integer"
          "minimum": 1
          "maximum": 32767
          "nullable": true
        "customerName":
          "type": "string"
          "maxLength": 100
          "nullable": true
        "customerPhone":
          "type": "string"
          "maxLength": 30
          "nullable": true
        "note":
          "type": "string"
          "maxLength": 2000
          "nullable": true
        "items":
          "type": "array"
          "minItems": 1
          "maxItems": 100
          "items":
            "$ref": "#/components/schemas/CreateLine"
      "oneOf":
        - "description": "DINE_IN from table, explicit SUBMIT required"
          "required": ["tableId", "submissionMode"]
          "properties":
            "serviceType": { "type": "string", "enum": ["DINE_IN"] }
            "tableId": { "type": "string", "format": "uuid" }
            "tableSessionId": { "type": "string", "nullable": true, "enum": [null] }
            "submissionMode": { "type": "string", "enum": ["SUBMIT"] }
        - "description": "Legacy DINE_IN using an already OPEN session, DRAFT or SUBMIT"
          "required": ["tableSessionId"]
          "properties":
            "serviceType": { "type": "string", "enum": ["DINE_IN"] }
            "tableSessionId": { "type": "string", "format": "uuid" }
            "tableId": { "type": "string", "nullable": true, "enum": [null] }
        - "description": "TAKEAWAY has neither seating reference"
          "properties":
            "serviceType": { "type": "string", "enum": ["TAKEAWAY"] }
            "tableSessionId": { "type": "string", "nullable": true, "enum": [null] }
            "tableId": { "type": "string", "nullable": true, "enum": [null] }
