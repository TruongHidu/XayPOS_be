services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kiot_tay_db
      POSTGRES_USER: ngocem1511
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - pos_saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngocem1511 -d kiot_tay_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pos_saas_postgres_data:
